<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PM Tool · EvolveCX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;}
:root{
  --bg:#f0f2f5;--surface:#fff;--border:#e2e8f0;--border-soft:#f1f5f9;
  --ink:#0f172a;--ink-2:#334155;--ink-3:#64748b;--ink-4:#94a3b8;
  --accent:#1a56db;--accent-bg:#eff6ff;--accent-border:#bfdbfe;
  --green:#16a34a;--green-bg:#dcfce7;
  --red:#dc2626;--red-bg:#fee2e2;
  --amber:#b45309;--amber-bg:#fef3c7;
  --purple:#7c3aed;--purple-bg:#ede9fe;
  --orange:#ea580c;--orange-bg:#fff7ed;
  --sidebar-bg:#0f172a;--sidebar-w:240px;--header-h:58px;
  --radius:14px;--shadow:0 4px 20px rgba(15,23,42,.08);--shadow-lg:0 20px 60px rgba(15,23,42,.2);
}
body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}

/* LOGIN */
#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a,#1e3a5f);}
.login-box{background:#fff;border-radius:20px;padding:40px 36px;width:380px;max-width:92vw;box-shadow:0 30px 80px rgba(0,0,0,.4);}
.login-logo{text-align:center;margin-bottom:28px;}
.login-logo .brand{font-size:26px;font-weight:900;color:var(--ink);}
.login-logo .sub{font-size:11px;color:var(--ink-3);margin-top:4px;font-weight:600;letter-spacing:1px;text-transform:uppercase;}
.lf{margin-bottom:12px;}
.lf label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-3);margin-bottom:5px;}
.lf input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;transition:border-color .15s;background:var(--bg);}
.lf input:focus{outline:none;border-color:var(--accent);background:#fff;}
.login-btn{width:100%;padding:13px;background:var(--ink);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer;margin-top:6px;}
.login-btn:hover{background:#1e293b;}
.login-btn:disabled{opacity:.6;cursor:default;}
.login-err{color:var(--red);font-size:13px;text-align:center;margin-top:10px;}

/* APP */
#appView{display:none;min-height:100vh;}
.layout{display:flex;min-height:100vh;}

/* SIDEBAR */
.sidebar{width:var(--sidebar-w);background:var(--sidebar-bg);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;}
.sb-logo{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.07);}
.sb-logo .brand{font-size:18px;font-weight:900;color:#fff;}
.sb-logo .sub{font-size:11px;color:rgba(255,255,255,.35);margin-top:2px;}
.sb-user{padding:12px 20px;border-bottom:1px solid rgba(255,255,255,.07);}
.sb-user .name{font-size:13px;font-weight:700;color:#fff;}
.sb-user .role{font-size:11px;color:rgba(255,255,255,.4);margin-top:2px;}
.sb-nav{flex:1;padding:10px;}
.nav-lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:rgba(255,255,255,.28);padding:10px 10px 5px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:rgba(255,255,255,.6);font-size:13px;font-weight:600;cursor:pointer;transition:all .12s;margin-bottom:2px;user-select:none;}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff;}
.nav-item.active{background:rgba(255,255,255,.13);color:#fff;}
.nav-item .icon{font-size:15px;width:20px;text-align:center;flex-shrink:0;}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:800;padding:2px 6px;border-radius:99px;min-width:18px;text-align:center;}
.sb-footer{padding:14px 10px;border-top:1px solid rgba(255,255,255,.07);}
.logout-btn{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;border-radius:9px;background:none;border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.5);font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .12s;}
.logout-btn:hover{background:rgba(255,255,255,.07);color:#fff;}

/* MAIN */
.main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh;}
.topbar{height:var(--header-h);background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:50;}
.topbar-title{font-size:15px;font-weight:800;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.page{padding:24px;}

/* TABS */
.tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:2px solid var(--border);padding-bottom:0;}
.tab{padding:9px 18px;border-radius:9px 9px 0 0;border:none;background:none;font-family:inherit;font-size:13px;font-weight:700;color:var(--ink-3);cursor:pointer;transition:all .12s;position:relative;bottom:-2px;}
.tab:hover{background:var(--bg);color:var(--ink-2);}
.tab.active{background:#fff;color:var(--accent);border:2px solid var(--border);border-bottom:2px solid #fff;}
.tab .cnt{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:99px;font-size:10px;font-weight:800;background:var(--red);color:#fff;margin-left:6px;vertical-align:middle;}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px;}
.kpi-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
.kpi-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-3);}
.kpi-value{font-size:30px;font-weight:900;color:var(--ink);margin-top:6px;line-height:1;}

/* FILTERS */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:flex-end;}
.fg{display:flex;flex-direction:column;gap:4px;}
.fg label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-3);}
.fi{padding:8px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink);min-width:160px;transition:border-color .15s;}
.fi:focus{outline:none;border-color:var(--accent);}

/* PROJECT CARDS */
.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
.pcard{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden;}
.pcard:hover{border-color:#93c5fd;box-shadow:0 8px 24px rgba(15,23,42,.1);transform:translateY(-1px);}
.pcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.pcard.s-requested::before{background:var(--orange);}
.pcard.s-draft::before{background:var(--ink-4);}
.pcard.s-inprogress::before{background:var(--accent);}
.pcard.s-onhold::before{background:var(--amber);}
.pcard.s-completed::before{background:var(--green);}
.pcard.s-cancelled::before{background:var(--red);}
.pcard.s-underreview::before{background:var(--purple);}
.pcard-area{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-3);margin-bottom:5px;}
.pcard-name{font-size:17px;font-weight:800;color:var(--ink);line-height:1.2;margin-bottom:8px;}
.pcard-obj{font-size:12px;color:var(--ink-3);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:12px;}
.pcard-meta{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
.pcard-row{display:flex;justify-content:space-between;font-size:12px;}
.pcard-row .lbl{color:var(--ink-3);}
.pcard-row .val{font-weight:700;color:var(--ink-2);}
.pcard-footer{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.progress-bg{height:6px;background:var(--bg);border-radius:99px;overflow:hidden;margin-bottom:4px;}
.progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .3s;}
.progress-lbl{font-size:11px;font-weight:700;color:var(--ink-3);margin-bottom:10px;}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:800;}
.b-requested{background:var(--orange-bg);color:var(--orange);}
.b-draft{background:#f1f5f9;color:#64748b;}
.b-inprogress{background:var(--accent-bg);color:var(--accent);}
.b-onhold{background:var(--amber-bg);color:var(--amber);}
.b-completed{background:var(--green-bg);color:var(--green);}
.b-cancelled{background:var(--red-bg);color:var(--red);}
.b-underreview{background:var(--purple-bg);color:var(--purple);}
.b-suggested{background:var(--purple-bg);color:var(--purple);border:1px solid #e9d5ff;}
.b-todo{background:#f1f5f9;color:#64748b;}
.b-done{background:var(--green-bg);color:var(--green);}
.b-blocked{background:var(--red-bg);color:var(--red);}
.b-paused{background:var(--amber-bg);color:var(--amber);}
.b-c-open{background:#f1f5f9;color:#64748b;}
.b-c-before{background:var(--green-bg);color:var(--green);}
.b-c-on{background:var(--accent-bg);color:var(--accent);}
.b-c-after{background:var(--red-bg);color:var(--red);}
.b-c-overdue{background:var(--red-bg);color:var(--red);}
.b-low{background:var(--green-bg);color:var(--green);}
.b-medium{background:var(--amber-bg);color:var(--amber);}
.b-high{background:var(--red-bg);color:var(--red);}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:9px;border:1.5px solid transparent;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .12s;text-decoration:none;white-space:nowrap;}
.btn-primary{background:var(--ink);color:#fff;border-color:var(--ink);}
.btn-primary:hover{background:#1e293b;}
.btn-ghost{background:#fff;color:var(--ink-2);border-color:var(--border);}
.btn-ghost:hover{background:var(--bg);border-color:#94a3b8;}
.btn-success{background:var(--green);color:#fff;border-color:var(--green);}
.btn-success:hover{background:#15803d;}
.btn-danger{background:var(--red);color:#fff;border-color:var(--red);}
.btn-danger:hover{background:#b91c1c;}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn-accent:hover{background:#1d4ed8;}
.btn-orange{background:var(--orange);color:#fff;border-color:var(--orange);}
.btn-orange:hover{background:#c2410c;}
.btn-purple{background:var(--purple);color:#fff;border-color:var(--purple);}
.btn-purple:hover{background:#6d28d9;}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;}
.btn:disabled{opacity:.5;cursor:default;pointer-events:none;}

/* MODAL */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:#fff;border-radius:18px;width:min(980px,100%);max-height:min(90vh,960px);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:modalIn .18s ease-out;}
.modal-sm{width:min(520px,100%);}
.modal-md{width:min(700px,100%);}
@keyframes modalIn{from{transform:scale(.97) translateY(8px);opacity:0;}to{transform:scale(1) translateY(0);opacity:1;}}
.modal-header{padding:18px 20px;display:flex;justify-content:space-between;align-items:flex-start;background:linear-gradient(180deg,#0f172a,#1e293b);color:#fff;flex-shrink:0;}
.mh-title{font-size:16px;font-weight:900;}
.mh-sub{font-size:12px;color:rgba(255,255,255,.55);margin-top:3px;}
.modal-close{background:rgba(255,255,255,.12);border:none;color:#fff;width:30px;height:30px;border-radius:99px;cursor:pointer;font-size:14px;display:grid;place-items:center;flex-shrink:0;transition:background .12s;}
.modal-close:hover{background:rgba(255,255,255,.22);}
.modal-body{flex:1;overflow-y:auto;padding:18px 20px;background:#f8fafc;}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;flex-shrink:0;background:#fff;}

/* PANEL */
.panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.panel:last-child{margin-bottom:0;}
.panel-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-3);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}

/* FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-grid-1{grid-template-columns:1fr;}
@media(max-width:520px){.form-grid{grid-template-columns:1fr;}}
.fg2{display:flex;flex-direction:column;gap:5px;}
.fg2.full{grid-column:1/-1;}
.fg2 label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-3);}
.fi2{padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;font-family:inherit;color:var(--ink);background:var(--bg);transition:border-color .15s,background .15s;width:100%;}
.fi2:focus{outline:none;border-color:var(--accent);background:#fff;}
.fi2[readonly]{background:#f1f5f9;color:var(--ink-3);cursor:default;}
textarea.fi2{resize:vertical;min-height:80px;}

/* KV */
.kv-grid{display:grid;gap:7px;}
.kv{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--bg);border-radius:9px;gap:12px;font-size:13px;}
.kv-l{color:var(--ink-3);font-weight:700;font-size:12px;flex-shrink:0;}
.kv-v{font-weight:800;color:var(--ink);text-align:right;}

/* KANBAN */
.kanban-wrap{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;}
.kanban-wrap::-webkit-scrollbar{height:5px;}
.kanban-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}
.kanban-col{min-width:250px;max-width:250px;border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column;}
.kanban-col-hdr{padding:11px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:#fff;}
.kanban-col-title{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;color:var(--ink);}
.k-dot{width:9px;height:9px;border-radius:99px;flex-shrink:0;}
.k-cnt{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--ink-3);border:1px solid var(--border);}
.kanban-col-body{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:60px;}
.k-card{background:#fff;border:1px solid var(--border);border-radius:11px;padding:12px;}
.k-card-name{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:8px;line-height:1.3;}
.k-card-meta{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-3);}
.k-card-foot{margin-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.droppable.drag-over{background:#eff6ff;border:2px dashed #93c5fd;border-radius:9px;}
.k-card[draggable]:active{cursor:grabbing;}

/* SUGGESTED */
.suggested-section{border:2px dashed #e9d5ff;background:#faf5ff;border-radius:var(--radius);padding:14px;margin-bottom:14px;}
.sug-item{background:#fff;border:1px solid #e9d5ff;border-radius:11px;padding:12px;margin-bottom:8px;}
.sug-item:last-child{margin-bottom:0;}
.sug-item-name{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:5px;}
.sug-item-meta{font-size:12px;color:var(--ink-3);margin-bottom:8px;display:flex;flex-direction:column;gap:2px;}
.sug-actions{display:flex;gap:6px;}

/* REQUIREMENTS FORM */
.req-section{background:#fffbeb;border:1px solid #fde68a;border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.req-section-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:#92400e;margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.req-block{background:#fff;border:1px solid #fde68a;border-radius:10px;padding:12px;margin-bottom:10px;}
.req-block:last-child{margin-bottom:0;}
.req-block-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:#b45309;margin-bottom:10px;}

/* ALERTS / BANNERS */
.banner{border-radius:12px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px;}
.banner-green{background:linear-gradient(135deg,#14532d,#166534);color:#fff;}
.banner-blue{background:linear-gradient(135deg,#1d4ed8,#1e40af);color:#fff;}
.banner-orange{background:linear-gradient(135deg,#c2410c,#ea580c);color:#fff;}
.banner-red{background:linear-gradient(135deg,#991b1b,#dc2626);color:#fff;}
.banner-purple{background:linear-gradient(135deg,#5b21b6,#7c3aed);color:#fff;}
.banner-text{font-size:14px;font-weight:700;}
.banner-sub{font-size:12px;opacity:.75;margin-top:2px;}

/* ROW */
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px dashed var(--border);font-size:13px;}
.row:last-child{border-bottom:none;}
.row-left{display:flex;flex-direction:column;gap:3px;min-width:0;}
.row-main{font-weight:700;color:var(--ink);}
.row-sub{font-size:12px;color:var(--ink-3);}

/* COLLAB PICKER */
.collab-picker{display:grid;gap:6px;max-height:200px;overflow-y:auto;}
.collab-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1.5px solid var(--border);border-radius:9px;cursor:pointer;transition:border-color .12s;}
.collab-item:hover{border-color:var(--accent-border);}
.collab-item input[type="checkbox"]{accent-color:var(--accent);}
.collab-name{font-size:13px;font-weight:700;color:var(--ink);}
.collab-area{font-size:11px;color:var(--ink-3);}

/* CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;background:var(--bg);border:1px solid var(--border);color:var(--ink-2);}

/* EMPTY */
.empty{padding:24px;text-align:center;color:var(--ink-3);font-size:13px;}
.empty-icon{font-size:28px;margin-bottom:8px;}
.empty-title{font-weight:800;color:var(--ink-2);margin-bottom:4px;}

/* REJECTION HISTORY */
.rejection-item{background:var(--red-bg);border:1px solid #fecaca;border-radius:10px;padding:12px;margin-bottom:8px;font-size:12px;}
.rejection-item .date{color:var(--red);font-weight:800;margin-bottom:4px;}
.rejection-item .note{color:#7f1d1d;line-height:1.4;}

/* REVIEW COUNT */
.review-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:800;}
.review-pill.r1{background:#fff7ed;color:var(--orange);border:1px solid #fed7aa;}
.review-pill.r2{background:var(--amber-bg);color:var(--amber);border:1px solid #fde68a;}
.review-pill.r3{background:var(--red-bg);color:var(--red);border:1px solid #fecaca;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView">
  <div class="login-box">
    <div class="login-logo">
      <div class="brand">📋 PM Tool</div>
      <div class="sub">EvolveCX · Project Management</div>
    </div>
    <div class="lf"><label>Corporate Email</label><input type="email" id="loginEmail" placeholder="you@evolvecx.com" autocomplete="email"></div>
    <div class="lf"><label>Password</label><input type="password" id="loginPassword" autocomplete="current-password"></div>
    <button class="login-btn" id="loginBtn">Sign in</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- APP -->
<div id="appView">
  <div class="layout">
    <aside class="sidebar">
      <div class="sb-logo"><div class="brand">📋 PM Tool</div><div class="sub">EvolveCX</div></div>
      <div class="sb-user" id="sbUser"></div>
      <nav class="sb-nav">
        <div class="nav-lbl">Navigation</div>
        <div class="nav-item active" id="navAll" onclick="setTab('all')">
          <span class="icon">🗂️</span> All Projects
          <span class="nav-badge" id="badgePending" style="display:none"></span>
        </div>
        <div class="nav-item" id="navMine" onclick="setTab('mine')">
          <span class="icon">👤</span> My Projects
        </div>
        <div class="nav-item" id="navReview" onclick="setTab('review')" id="navReview">
          <span class="icon">🔍</span> Under Review
          <span class="nav-badge" id="badgeReview" style="display:none"></span>
        </div>
      </nav>
      <div class="sb-footer">
        <button class="logout-btn" id="logoutBtn">↩ Sign out</button>
      </div>
    </aside>

function esc(v){ return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;"); }
function fmtNum(n,d=0){ const x=Number(n||0); return Number.isFinite(x)?x.toFixed(d):"0"; }
function isPast(d){ if(!d) return false; const t=new Date(); t.setHours(0,0,0,0); return new Date(d+"T00:00:00")<t; }

function projStatusClass(s){
  const m={"Requested":"requested","Under Review":"underreview","Draft":"draft","In Progress":"inprogress","On Hold":"onhold","Completed":"completed","Cancelled":"cancelled"};
  return m[s]||"draft";
}

function badgeStatus(s){
  const m={"Requested":"b-requested","Under Review":"b-underreview","Draft":"b-draft","In Progress":"b-inprogress","On Hold":"b-onhold","Completed":"b-completed","Cancelled":"b-cancelled","Suggested":"b-suggested","To Do":"b-todo","Done":"b-done","Blocked":"b-blocked","Paused":"b-paused"};
  return `<span class="badge ${m[s]||"b-draft"}">${esc(s)}</span>`;
}

function badgePriority(p){
  const m={"Low":"b-low","Medium":"b-medium","High":"b-high"};
  return `<span class="badge ${m[p]||"b-medium"}">${esc(p)}</span>`;
}

function badgeCompliance(l){
  const m={"Open":"b-c-open","Before deadline":"b-c-before","On deadline":"b-c-on","After deadline":"b-c-after","Overdue":"b-c-overdue"};
  return `<span class="badge ${m[l]||"b-c-open"}">${esc(l)}</span>`;
}

function projCompliance(p){
  if(!p?.completed_at||!p?.due_date) return "Open";
  const c=new Date(p.completed_at), d=new Date(p.due_date+"T23:59:59");
  if(c<d) return "Before deadline";
  if(c.toDateString()===d.toDateString()) return "On deadline";
  return "After deadline";
}

function taskCompliance(t){
  if(!t?.completed_at||!t?.due_date){
    if(t?.status!=="Done"&&t?.status!=="Suggested"&&isPast(t?.due_date)) return "Overdue";
    return "Open";
  }
  const c=new Date(t.completed_at), d=new Date(t.due_date+"T23:59:59");
  if(c<d) return "Before deadline";
  if(c.toDateString()===d.toDateString()) return "On deadline";
  return "After deadline";
}

function computeProgress(tasks){
  const clean=(tasks||[]).filter(t=>!t.is_deleted&&t.status!=="Suggested");
  if(!clean.length) return {done:0,total:0,pct:0};
  const tw=clean.reduce((s,t)=>s+Number(t.weight_percent||0),0);
  if(!tw){ const d=clean.filter(t=>t.status==="Done").length; return {done:d,total:clean.length,pct:clean.length?(d/clean.length)*100:0}; }
  const dw=clean.filter(t=>t.status==="Done").reduce((s,t)=>s+Number(t.weight_percent||0),0);
  return {done:dw,total:tw,pct:tw?(dw/tw)*100:0};
}

function dotColor(s){ const m={"To Do":"#94a3b8","In Progress":"#3b82f6","Blocked":"#ef4444","Paused":"#f59e0b","Done":"#10b981","Cancelled":"#64748b","Suggested":"#7c3aed"}; return m[s]||"#94a3b8"; }

function wireCollabPickerFilter(rootEl, name){
  const wrap = rootEl.querySelector(`#picker_${name}`);
  if(!wrap) return;
  const searchInput = wrap.querySelector(".collab-search");
  const areaFilter  = wrap.querySelector(".collab-area-filter");
  const items       = [...wrap.querySelectorAll(".collab-item")];
  const emptyMsg    = wrap.querySelector(".collab-empty");

  function applyFilter(){
    const q = (searchInput.value||"").trim().toLowerCase();
    const area = areaFilter.value;
    let visibleCount = 0;
    items.forEach(item=>{
      const matchesName = !q || item.getAttribute("data-name").includes(q);
      const matchesArea = !area || item.getAttribute("data-area") === area;
      const show = matchesName && matchesArea;
      item.style.display = show ? "" : "none";
      if(show) visibleCount++;
    });
    emptyMsg.style.display = visibleCount === 0 ? "" : "none";
  }

  searchInput.addEventListener("input", applyFilter);
  areaFilter.addEventListener("change", applyFilter);
}

function getChecked(name){ return [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(el=>el.value); }

async function loadProjects(){

  grid.innerHTML=`<div class="empty">Loading projects…</div>`;

  const q    =(document.getElementById("fSearch")?.value||"").trim().toLowerCase();

  const [projRes,users]=await Promise.all([
    supabase.from("pm_projects").select("*").eq("is_deleted",false).order("created_at",{ascending:false}),
    fetchUsers()
  ]);

  if(projRes.error){ grid.innerHTML=`<div class="empty">Error loading</div>`; return; }

  const um=uMap(users);
  let projects=projRes.data||[];

  // Tab filter
  if(activeTab==="mine") projects=projects.filter(p=>p.owner_user_id===currentUser.id||p.created_by_user_id===currentUser.id);
  if(activeTab==="review") projects=projects.filter(p=>p.status==="Requested"||p.status==="Under Review");

  if(type) projects=projects.filter(p=>p.area===type);
  if(stat) projects=projects.filter(p=>p.status===stat);
  if(q)    projects=projects.filter(p=>`${p.name||""} ${p.objective||""}`.toLowerCase().includes(q));

  // KPIs
  const active   =projects.filter(p=>["Draft","In Progress","On Hold"].includes(p.status)).length;
  const completed=projects.filter(p=>p.status==="Completed").length;
  const overdue  =projects.filter(p=>p.status!=="Completed"&&isPast(p.due_date)).length;
  const review   =projects.filter(p=>p.status==="Requested"||p.status==="Under Review").length;

  if(kpiGrid) kpiGrid.innerHTML=`
    <div class="kpi-card"><div class="kpi-label">Total</div><div class="kpi-value">${projects.length}</div></div>
    <div class="kpi-card"><div class="kpi-label">Active</div><div class="kpi-value" style="color:var(--accent)">${active}</div></div>

    ${isPM?`<div class="kpi-card"><div class="kpi-label">Awaiting Review</div><div class="kpi-value" style="color:var(--orange)">${review}</div></div>`:""}
  `;

  if(!projects.length){
    grid.innerHTML=`<div class="empty"><div class="empty-icon">📂</div><div class="empty-title">No projects found</div></div>`;

  grid.innerHTML=projects.map(p=>{
    const owner=um[p.owner_user_id]?.full_name||"Unassigned";
    const sc=projStatusClass(p.status);
    const rc=Number(p.review_count||0);
    const reviewPill=rc>0?`<span class="review-pill r${Math.min(rc,3)}">⟳ ${rc}/${MAX_REVIEWS}</span>`:"";

        <div class="pcard-name">${esc(p.name||"Untitled")}</div>

          <div class="pcard-row"><span class="lbl">Dates</span><span class="val">${esc(p.start_date||"—")} → ${esc(p.due_date||"—")}</span></div>
        </div>
        <div class="progress-bg"><div class="progress-fill" style="width:${fmtNum(p.progress_percent,0)}%"></div></div>
        <div class="progress-lbl">${fmtNum(p.progress_percent,0)}% complete</div>
        <div class="pcard-footer">
          ${badgeStatus(p.status)}
          ${badgePriority(p.priority||"Medium")}

}

async function createProject(btn,closeModal){
  const name    =document.getElementById("cpName")?.value?.trim();
  const area    =document.getElementById("cpType")?.value;
  const priority=document.getElementById("cpPriority")?.value||"Medium";
  const ownerId =document.getElementById("cpOwner")?.value;
  const start   =document.getElementById("cpStart")?.value;
  const due     =document.getElementById("cpDue")?.value;
  const objective=document.getElementById("cpObjective")?.value?.trim()||null;
  const collabs =getChecked("cp_collabs");

  if(!name||!area||!start||!due||!ownerId){ alert("Please fill Name, Type, Owner, Start Date and Due Date."); return; }
  if(new Date(due)<new Date(start)){ alert("Due date cannot be before start date."); return; }

  btn.disabled=true; btn.textContent="Submitting…";

  const {data:proj,error}=await supabase.from("pm_projects").insert({
    name,area,priority,status:"Requested",
    owner_user_id:ownerId,created_by_user_id:currentUser.id,
    start_date:start,due_date:due,objective,
    submitted_at:new Date().toISOString(),review_count:0
  }).select("*").single();

  if(error||!proj){ alert(error?.message||"Error"); btn.disabled=false; btn.textContent="Submit Request"; return; }

  // Members
  const mRows=[{project_id:proj.id,user_id:ownerId,member_role_in_project:"owner"}];
  collabs.filter(id=>id&&id!==ownerId).forEach(id=>mRows.push({project_id:proj.id,user_id:id,member_role_in_project:"collaborator"}));
  if(mRows.length) await supabase.from("pm_project_members").insert(mRows);

  closeModal?.();
  await renderPage();
  // Auto-open detail so owner can fill requirements
  await openProjectDetail(proj.id);
}

async function openProjectDetail(projectId){
  const [projRes,tasksRes,linksRes,membersRes,users]=await Promise.all([
    supabase.from("pm_projects").select("*").eq("id",projectId).single(),
    supabase.from("pm_tasks").select("*").eq("project_id",projectId).eq("is_deleted",false).order("created_at",{ascending:true}),
    supabase.from("pm_project_links").select("*").eq("project_id",projectId).order("created_at",{ascending:false}),
    supabase.from("pm_project_members").select("*").eq("project_id",projectId),
    fetchUsers()
  ]);

  if(projRes.error||!projRes.data){ alert("Could not load project."); return; }

  const project =projRes.data;
  const tasks   =tasksRes.data||[];
  const links   =linksRes.data||[];
  const members =membersRes.data||[];
  const um      =uMap(users);

  const suggested=tasks.filter(t=>t.status==="Suggested");
  const regular  =tasks.filter(t=>t.status!=="Suggested");
  const weighted =computeProgress(tasks);
  const ownerName=um[project.owner_user_id]?.full_name||"Unassigned";
  const compliance=projCompliance(project);
  const rc=Number(project.review_count||0);
  const isOwnerOrPM=isPM||(project.owner_user_id===currentUser.id)||(project.created_by_user_id===currentUser.id);

  // Parse requirements
  let req={};
  try{ req=(typeof project.requirements==="object"&&project.requirements!==null)?project.requirements:JSON.parse(project.requirements||"{}"); }catch(e){}

  /* ── BANNERS ── */
  let bannerHtml="";

  if(project.status==="Requested"&&isOwnerOrPM){
    bannerHtml+=`<div class="banner banner-orange">
      <div><div class="banner-text">📋 Awaiting PM Review</div>
      <div class="banner-sub">Make sure the Requirements Template is complete before the PM reviews.</div></div>

  if(project.status==="Under Review"&&isPM){
    bannerHtml+=`<div class="banner banner-purple">
      <div><div class="banner-text">🔍 Under Review</div>
      <div class="banner-sub">Review the requirements template and approve or reject this project request.</div></div>
      <div style="display:flex;gap:8px;flex-shrink:0;">

    bannerHtml+=`<div class="banner banner-orange" style="margin-top:0;">

      <div class="banner-sub">Project request awaiting your review.</div></div>
      <div style="display:flex;gap:8px;flex-shrink:0;">
        <button class="btn btn-purple btn-sm" id="btnStartReview">Start Review</button>
      </div>

  if(project.status==="Draft"&&isOwnerOrPM){
    bannerHtml+=`<div class="banner banner-blue">
      <div><div class="banner-text">✅ Approved — Add Tasks</div>
      <div class="banner-sub">Submit your Suggested Assignments. The PM will approve them before work begins.</div></div>

    bannerHtml+=`<div class="banner banner-green">

  }

  if(project.status==="Cancelled"&&project.cancelled_until){
    bannerHtml+=`<div class="banner banner-red">
      <div><div class="banner-text">🚫 Cancelled</div>
      <div class="banner-sub">This project was rejected ${MAX_REVIEWS} times and is frozen until ${esc(project.cancelled_until)}.</div></div>
    </div>`;
  }

  if(rc>0&&rc<MAX_REVIEWS&&["Requested","Draft"].includes(project.status)){
    bannerHtml+=`<div style="background:var(--red-bg);border:1px solid #fecaca;border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:13px;color:var(--red);font-weight:700;">
      ⚠️ This project has been rejected ${rc} time(s). ${MAX_REVIEWS-rc} attempt(s) remaining.
      ${project.rejection_notes?`<div style="margin-top:6px;font-weight:400;color:#7f1d1d;">${esc(project.rejection_notes)}</div>`:""}
    </div>`;
  }

  /* ── MEMBER CHIPS ── */
  const memberChips=members.map(m=>`<span class="chip">${esc(um[m.user_id]?.full_name||"Unknown")} · ${esc(m.member_role_in_project||"member")}</span>`).join("")||`<span class="chip">No members</span>`;

  /* ── LINKS ── */
  const linksHtml=links.length?links.map(l=>`
    <div class="row">
      <div class="row-left"><div class="row-main">${esc(l.title||"Untitled")}</div><div class="row-sub" style="word-break:break-all">${esc(l.url||"")}</div></div>
      <a href="${esc(l.url||"#")}" target="_blank" rel="noopener" class="btn btn-ghost btn-sm">Open ↗</a>
    </div>`).join(""):`<div class="empty" style="padding:12px">No links yet.</div>`;

  /* ── SUGGESTED TASKS ── */
  const suggestedHtml=suggested.length?`
    <div class="suggested-section">
      <div class="panel-title" style="color:var(--purple);">🟣 Suggested Assignments <span class="badge b-suggested">${suggested.length}</span></div>
      ${suggested.map(t=>{
        const tOwner=um[t.owner_user_id]?.full_name||"Unassigned";
        return `<div class="sug-item" data-sug-id="${esc(t.id)}">
          <div class="sug-item-name">${esc(t.name||"Untitled task")}</div>
          <div class="sug-item-meta">
            <span><strong>Owner:</strong> ${esc(tOwner)}</span>
            <span><strong>Due:</strong> ${esc(t.due_date||"—")} · <strong>Hours:</strong> ${fmtNum(t.allocated_hours,1)}h · <strong>Weight:</strong> ${fmtNum(t.weight_percent,2)}%</span>
          </div>
          ${isPM?`<div class="sug-actions">
            <button class="btn btn-success btn-sm" data-approve-task="${esc(t.id)}">✓ Approve</button>
            <button class="btn btn-danger btn-sm" data-decline-task="${esc(t.id)}">✕ Decline</button>
          </div>`:`<span class="badge b-suggested">Pending PM approval</span>`}
        </div>`;
      }).join("")}
    </div>`:"";

  /* ── REQUIREMENTS TEMPLATE ── */
  const canEditReq=isOwnerOrPM;
  const reqHtml=`
    <div class="req-section">
      <div class="req-section-title">📋 Requirements Template
        ${canEditReq?`<button class="btn btn-sm" style="background:#fff;color:#92400e;border:1px solid #fde68a;" id="btnEditReq">✏️ Edit</button>`:""}
      </div>

      ${buildReqView(req,1,"Información General del Proyecto",["¿Nombre del proyecto?","¿Área solicitante?","¿Solicitante (nombre y rol)?"])}
      ${buildReqView(req,2,"Objetivo del Proyecto",["¿Qué se busca lograr?","¿Por qué es importante?","¿Qué problema resuelve?"])}
      ${buildReqView(req,3,"Alcance",["¿Qué incluye?","¿Qué no incluye?","¿Qué esperas recibir?","¿Qué sería una mala experiencia?","Si recortáramos tiempo, ¿qué es indispensable?"])}
      ${buildReqView(req,4,"Requerimientos",["Req 1 — ¿Qué problema tienes?","Req 1 — ¿Qué impacto tiene?","Req 2 — Cambios de estructura (si aplica)","Req 3 — Requerimientos técnicos"])}
      ${buildReqView(req,5,"Stakeholders y Usuarios",["Stakeholders clave","Usuarios finales","Áreas involucradas"])}
      ${buildReqSection6View(req)}
      ${buildReqSection7View(req)}
      ${buildReqView(req,8,"Riesgos y Dependencias",["Riesgos identificados","Dependencias","¿Qué podría retrasar el proyecto?","¿Dependemos de aprobaciones externas?"])}
      ${buildReqView(req,9,"Bloqueos",["¿Qué asumimos para avanzar?","¿Se necesita presupuesto aprobado?","¿Se cuenta con accesos o herramientas?"])}
      ${buildReqView(req,10,"Métricas de Éxito (KPIs)",["KPI 1","KPI 2","KPI 3","¿Qué indicadores deben mejorar?"])}
      ${buildReqView(req,11,"Recursos Requeridos",["Personas necesarias","Herramientas requeridas","Presupuesto (si aplica)"])}
    </div>`;

  /* ── CLOSURE REPORT ── */
  let closureReportHtml = "";
  if(project.status==="Completed" && project.closure_report){
    const cr = typeof project.closure_report==="object" ? project.closure_report : JSON.parse(project.closure_report||"{}");
    closureReportHtml = `
      <div class="panel" style="border:2px solid var(--green);background:#f0fdf4;">
        <div class="panel-title" style="color:var(--green);font-size:13px;">📊 Closure Report</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div>
            <div style="font-size:11px;font-weight:800;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px;">SLA del Proyecto</div>
            <div class="kv-grid">
              <div class="kv"><span class="kv-l">Due Date</span><span class="kv-v">${esc(cr.due_date||"—")}</span></div>
              <div class="kv"><span class="kv-l">Completed On</span><span class="kv-v">${esc(cr.completed_on||"—")}</span></div>
              <div class="kv"><span class="kv-l">SLA Result</span>${badgeCompliance(cr.sla_result||"Open")}</div>
              <div class="kv"><span class="kv-l">Days Diff</span><span class="kv-v" style="color:${cr.days_diff>0?"var(--red)":cr.days_diff<0?"var(--green)":"var(--accent)"}">${cr.days_diff>0?"+":""}${cr.days_diff||0} days</span></div>
            </div>
          </div>
          <div>
            <div style="font-size:11px;font-weight:800;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px;">Suggested Assignments</div>
            <div class="kv-grid">
              <div class="kv"><span class="kv-l">Submitted</span><span class="kv-v">${cr.suggested_total||0}</span></div>
              <div class="kv"><span class="kv-l">Approved</span><span class="kv-v" style="color:var(--green)">${cr.suggested_approved||0}</span></div>
              <div class="kv"><span class="kv-l">Rejected</span><span class="kv-v" style="color:var(--red)">${cr.suggested_rejected||0}</span></div>
            </div>
          </div>
          <div>
            <div style="font-size:11px;font-weight:800;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px;">Tasks Performance</div>
            <div class="kv-grid">
              <div class="kv"><span class="kv-l">Total Tasks</span><span class="kv-v">${cr.tasks_total||0}</span></div>
              <div class="kv"><span class="kv-l">Completed</span><span class="kv-v" style="color:var(--green)">${cr.tasks_done||0}</span></div>
              <div class="kv"><span class="kv-l">On Time</span><span class="kv-v" style="color:var(--green)">${cr.tasks_on_time||0}</span></div>
              <div class="kv"><span class="kv-l">Late</span><span class="kv-v" style="color:var(--red)">${cr.tasks_late||0}</span></div>
              <div class="kv"><span class="kv-l">Cancelled</span><span class="kv-v" style="color:var(--ink-3)">${cr.tasks_cancelled||0}</span></div>
            </div>
          </div>
          <div>
            <div style="font-size:11px;font-weight:800;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px;">Team</div>
            <div class="kv-grid">
              <div class="kv"><span class="kv-l">Owner</span><span class="kv-v">${esc(cr.owner_name||"—")}</span></div>
            </div>
            <div style="margin-top:8px;">
              <div style="font-size:11px;color:var(--ink-3);font-weight:700;margin-bottom:5px;">Collaborators</div>
              <div class="chips">${(cr.collaborators||[]).map(c=>`<span class="chip">${esc(c)}</span>`).join("")||"<span class='chip'>None</span>"}</div>
            </div>
          </div>
        </div>
        ${cr.pm_notes?`<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--green-bg);">
          <div style="font-size:11px;font-weight:800;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px;">PM Notes</div>
          <div style="font-size:13px;color:var(--ink-2);line-height:1.5;">${esc(cr.pm_notes)}</div>
        </div>`:""}
      </div>`;
  }

  /* ── KANBAN ── */
  const kanbanStatuses=["To Do","In Progress","Blocked","Paused","Done","Cancelled"];
  const kanbanHtml=kanbanStatuses.map(s=>renderKanbanCol(s,regular,um)).join("");

  /* ── BUILD BODY ── */
  const body=`
    ${bannerHtml}

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;">
      <div class="panel" style="margin-bottom:0">
        <div class="panel-title">Project Info</div>
        <div class="kv-grid">
          <div class="kv"><span class="kv-l">Owner</span><span class="kv-v">${esc(ownerName)}</span></div>
          <div class="kv"><span class="kv-l">Status</span>${badgeStatus(project.status)}</div>
          <div class="kv"><span class="kv-l">Type</span><span class="kv-v">${esc(project.area||"—")}</span></div>
          <div class="kv"><span class="kv-l">Priority</span>${badgePriority(project.priority||"Medium")}</div>
          <div class="kv"><span class="kv-l">Start</span><span class="kv-v">${esc(project.start_date||"—")}</span></div>
          <div class="kv"><span class="kv-l">Due</span>
            <span class="kv-v" style="display:flex;align-items:center;gap:8px;">
              ${esc(project.due_date||"—")}
              ${isPM&&project.status!=="Completed"?`<button class="btn btn-ghost btn-sm" id="btnEditDue" style="padding:3px 8px;font-size:11px;">✏️</button>`:""}
            </span>
          </div>
          ${rc>0?`<div class="kv"><span class="kv-l">Review attempts</span><span class="kv-v" style="color:var(--red)">${rc} / ${MAX_REVIEWS}</span></div>`:""}
        </div>
        ${project.objective?`<div style="margin-top:12px;"><div style="font-size:11px;font-weight:800;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px;">Objective</div><div style="font-size:13px;color:var(--ink-2);line-height:1.5">${esc(project.objective)}</div></div>`:""}
        <div style="margin-top:12px;"><div style="font-size:11px;font-weight:800;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px;">Members</div><div class="chips">${memberChips}</div></div>
      </div>

      <div class="panel" style="margin-bottom:0">
        <div class="panel-title">Progress</div>
        <div class="progress-bg" style="height:10px;"><div class="progress-fill" style="width:${fmtNum(weighted.pct,1)}%"></div></div>
        <div style="font-size:24px;font-weight:900;margin:8px 0;">${fmtNum(weighted.pct,1)}%</div>
        <div class="kv-grid">
          <div class="kv"><span class="kv-l">Tasks</span><span class="kv-v">${regular.length}</span></div>
          <div class="kv"><span class="kv-l">Done</span><span class="kv-v">${regular.filter(t=>t.status==="Done").length}</span></div>
          ${suggested.length?`<div class="kv"><span class="kv-l">Pending approval</span><span class="kv-v" style="color:var(--purple)">${suggested.length}</span></div>`:""}
          <div class="kv"><span class="kv-l">Compliance</span>${badgeCompliance(compliance)}</div>
        </div>
      </div>
    </div>

    ${closureReportHtml}

    ${reqHtml}

    ${suggestedHtml}

    <div class="panel">
      <div class="panel-title">Project Links
        ${isPM?`<button class="btn btn-ghost btn-sm" id="btnAddLink">+ Add Link</button>`:""}
      </div>
      ${linksHtml}
    </div>

    <div class="panel">
      <div class="panel-title">Tasks · Kanban
        <button class="btn btn-primary btn-sm" id="btnAddTask">+ ${isPM?"Add Task":"Suggest Assignment"}</button>
      </div>
      <div class="kanban-wrap" style="margin-top:10px;">${kanbanHtml}</div>
    </div>
  `;

  const footer=`<button class="btn btn-ghost" data-close>Close</button>`;
  const {el,close}=openModal(mShell(project.name||"Project",`${project.area||"—"} · ${project.status}`,body,footer));

  // Init drag & drop on kanban
  const kanbanContainer = el.querySelector(".kanban-wrap");
  if(kanbanContainer) initKanbanDragDrop(kanbanContainer, project.id, close);

  /* ── WIRE BUTTONS ── */

  // Start review (PM moves Requested → Under Review)
  el.querySelector("#btnStartReview")?.addEventListener("click",async()=>{
    await supabase.from("pm_projects").update({status:"Under Review"}).eq("id",project.id);
    close(); await renderPage(); await openProjectDetail(project.id);
  });

  // Approve project
  el.querySelector("#btnApprove")?.addEventListener("click",async()=>{
    if(!isPM) return;
    if(!confirm(`Approve "${project.name}"?`)) return;
    await supabase.from("pm_projects").update({status:"Draft",approved_at:new Date().toISOString()}).eq("id",project.id);
    close(); await renderPage(); await openProjectDetail(project.id);
  });

  // Reject project
  el.querySelector("#btnReject")?.addEventListener("click",async()=>{
    if(!isPM) return;
    const note=prompt("Rejection reason (required):");
    if(!note?.trim()) return;
    const newRc=rc+1;
    if(newRc>=MAX_REVIEWS){
      // Cancel for 30 days
      const cancelUntil=new Date(); cancelUntil.setDate(cancelUntil.getDate()+30);
      await supabase.from("pm_projects").update({
        status:"Cancelled",review_count:newRc,rejection_notes:note.trim(),
        cancelled_until:cancelUntil.toISOString().split("T")[0]
      }).eq("id",project.id);
      alert(`This project has been rejected ${MAX_REVIEWS} times and is now cancelled for 30 days.`);
    } else {
      await supabase.from("pm_projects").update({
        status:"Requested",review_count:newRc,rejection_notes:note.trim()
      }).eq("id",project.id);
    }
    close(); await renderPage(); await openProjectDetail(project.id);
  });

  // Mark complete — open closure report modal
  el.querySelector("#btnComplete")?.addEventListener("click",async()=>{
    if(!isPM) return;
    await openClosureModal(project, tasks, members, um, close);
  });

  // Edit due date (PM only)
  el.querySelector("#btnEditDue")?.addEventListener("click",async()=>{
    const newDue=prompt("New due date (YYYY-MM-DD):",project.due_date||"");
    if(!newDue?.match(/^\d{4}-\d{2}-\d{2}$/)) return;
    await supabase.from("pm_projects").update({due_date:newDue}).eq("id",project.id);
    close(); await openProjectDetail(project.id);
  });

  // Edit requirements
  el.querySelector("#btnEditReq")?.addEventListener("click",()=>openEditReqModal(project,close));

  // Add link
  el.querySelector("#btnAddLink")?.addEventListener("click",()=>openAddLinkModal(project.id,close));

  // Add task
  el.querySelector("#btnAddTask")?.addEventListener("click",()=>openAddTaskModal(project.id,close));

  // Approve / Decline suggested tasks
  el.querySelectorAll("[data-approve-task]").forEach(btn=>{
    btn.addEventListener("click",async()=>{
      if(!isPM) return;
      await supabase.from("pm_tasks").update({status:"To Do"}).eq("id",btn.getAttribute("data-approve-task"));
      // Check if all suggested tasks approved → move to In Progress
      const {data:remaining}=await supabase.from("pm_tasks").select("id").eq("project_id",project.id).eq("status","Suggested").eq("is_deleted",false);
      if(!remaining?.length && project.status==="Draft"){
        await supabase.from("pm_projects").update({status:"In Progress"}).eq("id",project.id);
      }
      close(); await renderPage(); await openProjectDetail(project.id);
    });
  });

  el.querySelectorAll("[data-decline-task]").forEach(btn=>{
    btn.addEventListener("click",async()=>{
      if(!isPM) return;
      if(!confirm("Decline this suggested task?")) return;
      await supabase.from("pm_tasks").update({status:"Cancelled"}).eq("id",btn.getAttribute("data-decline-task"));
      close(); await renderPage(); await openProjectDetail(project.id);
    });
  });
}
window.openProjectDetail=openProjectDetail;

/* ═══════════════════════════════════
   REQUIREMENTS HELPERS
═══════════════════════════════════ */
function buildReqView(req,sectionNum,title,questions){
  const data=req[`s${sectionNum}`]||{};
  const filled=questions.some((_,i)=>data[`q${i}`]);
  return `
    <div class="req-block">
      <div class="req-block-title">${sectionNum}. ${esc(title)} ${filled?"":"<span style='color:#ef4444;font-size:10px;'>⚠ Incomplete</span>"}</div>
      ${questions.map((q,i)=>`
        <div style="margin-bottom:8px;">
          <div style="font-size:11px;color:var(--ink-3);font-weight:700;margin-bottom:3px;">${esc(q)}</div>
          <div style="font-size:13px;color:var(--ink);line-height:1.4;min-height:20px;">${data[`q${i}`]?esc(data[`q${i}`]):`<span style="color:var(--ink-4);font-style:italic;">Not filled yet</span>`}</div>
        </div>`).join("")}
    </div>`;
}

/* Section 6 — Tiempos y Fechas Clave (dates + dynamic milestones) */
function buildReqSection6View(req){
  const data = req.s6 || {};
  const startDate     = data.q0 || "";
  const dueDate       = data.q1 || "";
  const milestones    = Array.isArray(data.q2) ? data.q2 : [];
  const visibility    = data.q3 || "";
  const filled = startDate || dueDate || milestones.length || visibility;

  return `
    <div class="req-block">
      <div class="req-block-title">6. Tiempos y Fechas Clave ${filled?"":"<span style='color:#ef4444;font-size:10px;'>⚠ Incomplete</span>"}</div>

      <div style="margin-bottom:8px;">
        <div style="font-size:11px;color:var(--ink-3);font-weight:700;margin-bottom:3px;">Fecha ideal de inicio</div>
        <div style="font-size:13px;color:var(--ink);line-height:1.4;min-height:20px;">${startDate?esc(startDate):`<span style="color:var(--ink-4);font-style:italic;">Not filled yet</span>`}</div>
      </div>

      <div style="margin-bottom:8px;">
        <div style="font-size:11px;color:var(--ink-3);font-weight:700;margin-bottom:3px;">Fecha objetivo de entrega</div>
        <div style="font-size:13px;color:var(--ink);line-height:1.4;min-height:20px;">${dueDate?esc(dueDate):`<span style="color:var(--ink-4);font-style:italic;">Not filled yet</span>`}</div>
      </div>

      <div style="margin-bottom:8px;">
        <div style="font-size:11px;color:var(--ink-3);font-weight:700;margin-bottom:5px;">Fechas críticas / hitos</div>
        ${milestones.length ? `
          <div style="display:flex;flex-direction:column;gap:6px;">
            ${milestones.map(m => `
              <div style="display:flex;justify-content:space-between;align-items:center;background:var(--bg);border-radius:8px;padding:7px 10px;font-size:13px;">
                <span style="font-weight:700;color:var(--ink);">${esc(m.label||"—")}</span>
                <span style="color:var(--ink-3);font-weight:700;">${esc(m.date||"—")}</span>
              </div>`).join("")}
          </div>
        ` : `<span style="color:var(--ink-4);font-style:italic;font-size:13px;">No milestones yet</span>`}
      </div>

      <div>
        <div style="font-size:11px;color:var(--ink-3);font-weight:700;margin-bottom:3px;">¿Quién necesita visibilidad o reportes del avance?</div>
        <div style="font-size:13px;color:var(--ink);line-height:1.4;min-height:20px;">${visibility?esc(visibility):`<span style="color:var(--ink-4);font-style:italic;">Not filled yet</span>`}</div>
      </div>
    </div>`;
}


/* Section 7 — Prioridad (dropdown P0-P3) */
function buildReqSection7View(req){
  const data = req.s7 || {};
  const priorityType = data.q0 || "";
  const reason = data.q1 || "";
  const filled = priorityType || reason;

  const priorityLabels = {
    "P0": "P0 - Crítico",
    "P1": "P1 - Alto (Urgente)",
    "P2": "P2 - Medio (Importante)",
    "P3": "P3 - Bajo (Menor)"
  };

  return `
    <div class="req-block">
      <div class="req-block-title">7. Prioridad ${filled?"":"<span style='color:#ef4444;font-size:10px;'>⚠ Incomplete</span>"}</div>

          return `<div class="k-card" draggable="true" data-task-id="${t.id}" data-task-status="${esc(t.status)}" style="cursor:grab;">
            <div class="k-card-name">${esc(t.name||"Untitled")}</div>

            </div>

function initKanbanDragDrop(containerEl, projectId, closeParent){
  let draggingId = null;

  containerEl.querySelectorAll(".k-card[draggable]").forEach(card => {
    card.addEventListener("dragstart", e => {
      draggingId = card.getAttribute("data-task-id");
      card.style.opacity = "0.4";
      e.dataTransfer.effectAllowed = "move";
    });
    card.addEventListener("dragend", () => {
      card.style.opacity = "1";
      containerEl.querySelectorAll(".droppable").forEach(col => col.classList.remove("drag-over"));
    });
  });

  containerEl.querySelectorAll(".droppable").forEach(col => {
    col.addEventListener("dragover", e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      containerEl.querySelectorAll(".droppable").forEach(c => c.classList.remove("drag-over"));
      col.classList.add("drag-over");
    });
    col.addEventListener("dragleave", () => col.classList.remove("drag-over"));
    col.addEventListener("drop", async e => {
      e.preventDefault();
      col.classList.remove("drag-over");
      const newStatus = col.getAttribute("data-status");
      if(!draggingId || !newStatus) return;

      // Optimistic update
      const card = containerEl.querySelector(`[data-task-id="${draggingId}"]`);
      if(card?.getAttribute("data-task-status") === newStatus) return;

      const { error } = await supabase.from("pm_tasks")
        .update({ status: newStatus, completed_at: newStatus === "Done" ? new Date().toISOString() : null })
        .eq("id", draggingId);

      if(error){ alert(error.message); return; }

      // Reload detail
      closeParent?.();
      await renderPage();
      await openProjectDetail(projectId);
    });
  });
}

async function createTask(projectId,btn,closeModal,closeParent){
  const name    =document.getElementById("ctName")?.value?.trim();
  const ownerId =document.getElementById("ctOwner")?.value;
  const status  =isPM?"To Do":"Suggested";
  const priority=document.getElementById("ctPriority")?.value||"Medium";
  const start   =document.getElementById("ctStart")?.value;
  const due     =document.getElementById("ctDue")?.value;
  const hours   =Number(document.getElementById("ctHours")?.value||0);
  const weight  =Number(document.getElementById("ctWeight")?.value||0);
  const collabs =getChecked("ct_collabs");

  if(!name||!start||!due||!ownerId){ alert("Please fill Name, Owner, Start Date and Due Date."); return; }
  if(new Date(due)<new Date(start)){ alert("Due date cannot be before start date."); return; }

  btn.disabled=true; btn.textContent="Saving…";

  const {data:task,error}=await supabase.from("pm_tasks").insert({
    project_id:projectId,name,status,priority,
    owner_user_id:ownerId,created_by_user_id:currentUser.id,
    start_date:start,due_date:due,allocated_hours:hours,estimated_hours:hours,weight_percent:weight
  }).select("*").single();

  if(error||!task){ alert(error?.message||"Error creating task"); btn.disabled=false; btn.textContent=isPM?"Create Task":"Submit Suggestion"; return; }

  const cr=collabs.filter(id=>id&&id!==ownerId).map(id=>({task_id:task.id,user_id:id}));
  if(cr.length) await supabase.from("pm_task_collaborators").insert(cr);

  closeModal?.(); closeParent?.();
  await renderPage();
  await openProjectDetail(projectId);
}

/* ═══════════════════════════════════
   CLOSURE REPORT MODAL
═══════════════════════════════════ */
async function openClosureModal(project, tasks, members, um, closeParent){
  if(!isPM) return;

  const now = new Date();
  const completedOn = now.toISOString().split("T")[0];
  const due = project.due_date;

  // SLA
  let slaResult = "Open";
  let daysDiff = 0;
  if(due){
    const dueDate = new Date(due + "T23:59:59");
    daysDiff = Math.round((now - dueDate) / (1000*60*60*24));
    if(daysDiff < 0) slaResult = "Before deadline";
    else if(daysDiff === 0) slaResult = "On deadline";
    else slaResult = "After deadline";
  }

  // All tasks including suggested
  const allTasks = tasks;
  const suggestedAll  = allTasks.filter(t => t.status === "Suggested");
  const suggestedAppr = allTasks.filter(t => t.status !== "Suggested" && t.status !== "Cancelled");
  const suggestedRej  = allTasks.filter(t => t.status === "Cancelled");

  // We need to fetch ALL tasks including cancelled ones (already loaded)
  const regularTasks  = allTasks.filter(t => t.status !== "Suggested");
  const doneTasks     = regularTasks.filter(t => t.status === "Done");
  const cancelledT    = regularTasks.filter(t => t.status === "Cancelled");

  // On time = completed_at <= due_date
  const onTime = doneTasks.filter(t => {
    if(!t.completed_at || !t.due_date) return false;
    return new Date(t.completed_at) <= new Date(t.due_date + "T23:59:59");
  });
  const late = doneTasks.filter(t => {
    if(!t.completed_at || !t.due_date) return true;
    return new Date(t.completed_at) > new Date(t.due_date + "T23:59:59");
  });

  // Team
  const ownerName = um[project.owner_user_id]?.full_name || "Unassigned";
  const collabNames = members
    .filter(m => m.member_role_in_project !== "owner")
    .map(m => um[m.user_id]?.full_name || "Unknown");

  const slaColor = slaResult==="Before deadline"?"var(--green)":slaResult==="On deadline"?"var(--accent)":"var(--red)";

  const body = `
    <div class="panel" style="background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:1px solid #bbf7d0;margin-bottom:14px;">
      <div style="font-size:15px;font-weight:900;color:var(--green);margin-bottom:4px;">📊 Project Closure Report</div>
      <div style="font-size:12px;color:var(--ink-3);">${esc(project.name)} · Completing on ${esc(completedOn)}</div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;">
      <div class="panel" style="margin-bottom:0;">
        <div class="panel-title">SLA del Proyecto</div>
        <div class="kv-grid">
          <div class="kv"><span class="kv-l">Due Date</span><span class="kv-v">${esc(due||"—")}</span></div>
          <div class="kv"><span class="kv-l">Completed On</span><span class="kv-v">${esc(completedOn)}</span></div>
          <div class="kv"><span class="kv-l">SLA Result</span>${badgeCompliance(slaResult)}</div>
          <div class="kv"><span class="kv-l">Difference</span><span class="kv-v" style="color:${slaColor}">${daysDiff>0?"+":""}${daysDiff} days</span></div>
        </div>
      </div>
      <div class="panel" style="margin-bottom:0;">
        <div class="panel-title">Suggested Assignments</div>
        <div class="kv-grid">
          <div class="kv"><span class="kv-l">Total submitted</span><span class="kv-v">${allTasks.filter(t=>t.created_by_user_id!==currentUser.id||true).length}</span></div>
          <div class="kv"><span class="kv-l">Approved</span><span class="kv-v" style="color:var(--green)">${suggestedAppr.length}</span></div>
          <div class="kv"><span class="kv-l">Rejected</span><span class="kv-v" style="color:var(--red)">${suggestedRej.length}</span></div>
          <div class="kv"><span class="kv-l">Pending</span><span class="kv-v" style="color:var(--purple)">${suggestedAll.length}</span></div>
        </div>
      </div>
      <div class="panel" style="margin-bottom:0;">
        <div class="panel-title">Tasks Performance</div>
        <div class="kv-grid">
          <div class="kv"><span class="kv-l">Total tasks</span><span class="kv-v">${regularTasks.length}</span></div>
          <div class="kv"><span class="kv-l">Done</span><span class="kv-v" style="color:var(--green)">${doneTasks.length}</span></div>
          <div class="kv"><span class="kv-l">On time</span><span class="kv-v" style="color:var(--green)">${onTime.length}</span></div>
          <div class="kv"><span class="kv-l">Late</span><span class="kv-v" style="color:var(--red)">${late.length}</span></div>
          <div class="kv"><span class="kv-l">Cancelled</span><span class="kv-v" style="color:var(--ink-3)">${cancelledT.length}</span></div>
        </div>
      </div>
      <div class="panel" style="margin-bottom:0;">
        <div class="panel-title">Team</div>
        <div class="kv-grid">
          <div class="kv"><span class="kv-l">Owner</span><span class="kv-v">${esc(ownerName)}</span></div>
        </div>
        <div style="margin-top:8px;">
          <div style="font-size:11px;color:var(--ink-3);font-weight:700;margin-bottom:5px;">Collaborators</div>
          <div class="chips">${collabNames.map(c=>`<span class="chip">${esc(c)}</span>`).join("")||"<span class='chip'>None</span>"}</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">PM Notes (optional)</div>
      <textarea id="closureNotes" class="fi2" rows="3" placeholder="Add any notes about the project outcome, lessons learned, etc."></textarea>
    </div>
  `;

  const footer = `
    <button class="btn btn-ghost" data-close>Cancel</button>
    <button class="btn btn-success" id="btnConfirmComplete">✓ Confirm & Complete Project</button>
  `;

  const {el, close} = openModal(mShell("Complete Project", "Review the closure report before confirming", body, footer));

  el.querySelector("#btnConfirmComplete").addEventListener("click", async () => {
    const btn = el.querySelector("#btnConfirmComplete");
    btn.disabled = true; btn.textContent = "Completing…";

    const notes = document.getElementById("closureNotes")?.value?.trim() || "";

    // Fetch all tasks including suggested with proper counts
    const { data: allTasksFull } = await supabase.from("pm_tasks")
      .select("*").eq("project_id", project.id).eq("is_deleted", false);

    const atf = allTasksFull || [];
    const sugTotal    = atf.length;
    const sugApproved = atf.filter(t => t.status !== "Suggested" && t.status !== "Cancelled").length;
    const sugRejected = atf.filter(t => t.status === "Cancelled").length;
    const regTasks    = atf.filter(t => t.status !== "Suggested");
    const doneT       = regTasks.filter(t => t.status === "Done");
    const cancelT     = regTasks.filter(t => t.status === "Cancelled");
    const onTimeT     = doneT.filter(t => t.completed_at && t.due_date && new Date(t.completed_at) <= new Date(t.due_date + "T23:59:59"));
    const lateT       = doneT.filter(t => !t.completed_at || !t.due_date || new Date(t.completed_at) > new Date(t.due_date + "T23:59:59"));

    const closure_report = {
      due_date: due,
      completed_on: completedOn,
      sla_result: slaResult,
      days_diff: daysDiff,
      suggested_total: sugTotal,
      suggested_approved: sugApproved,
      suggested_rejected: sugRejected,
      tasks_total: regTasks.length,
      tasks_done: doneT.length,
      tasks_on_time: onTimeT.length,
      tasks_late: lateT.length,
      tasks_cancelled: cancelT.length,
      owner_name: ownerName,
      collaborators: collabNames,
      pm_notes: notes,
      closed_by: currentUser.nombre,
      closed_at: now.toISOString()
    };

    const { error } = await supabase.from("pm_projects").update({
      status: "Completed",
      completed_at: now.toISOString(),
      closure_report
    }).eq("id", project.id);

    if(error){ alert(error.message); btn.disabled=false; btn.textContent="✓ Confirm & Complete Project"; return; }

    close();
    closeParent?.();
    await renderPage();
    await openProjectDetail(project.id);
  });
}
window.openClosureModal = openClosureModal;

</script>
</body>
</html>
