    .mascota-img{height:220px;object-fit:contain;filter:drop-shadow(0 20px 40px rgba(0,0,0,.4));
      transition:transform .3s ease}
    .mascota-img:hover{transform:translateY(-8px)}
    .mascota-name{color:rgba(255,255,255,.5);font-size:11px;font-weight:600;
      text-transform:uppercase;letter-spacing:1px;margin-top:10px}
    .l-tagline{
      color:rgba(255,255,255,.7);font-size:15px;font-weight:400;
      margin-top:32px;text-align:center;line-height:1.6;position:relative;z-index:1;
      max-width:340px;
    }
    .l-tagline strong{color:#62D3F5}
    /* Panel derecho — formulario */
    .l-right{
      width:420px;flex-shrink:0;background:#fff;display:flex;flex-direction:column;
      justify-content:center;padding:48px 40px;
    }
    .l-logo{font-size:32px;font-weight:700;color:#0F172A;letter-spacing:-.5px;margin-bottom:4px}
    .l-logo em{color:#62D3F5;font-style:normal}
    .l-sub{font-size:11px;color:#94A3B8;text-transform:uppercase;letter-spacing:1px;margin-bottom:36px}
    .l-label{display:block;font-size:11px;font-weight:700;color:#64748B;
      text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
    .l-input{width:100%;border:1.5px solid #E2E8F0;border-radius:10px;
      padding:12px 14px;font-size:14px;font-family:inherit;outline:none;
      transition:all .15s;color:#0F172A;background:#FAFAFA}
    .l-input:focus{border-color:#62D3F5;background:#fff;box-shadow:0 0 0 3px rgba(98,211,245,.12)}
    .l-btn{width:100%;padding:14px;border:none;border-radius:10px;
      background:#0F172A;color:#fff;font-size:14px;font-weight:700;
      cursor:pointer;font-family:inherit;transition:all .15s;margin-top:8px;
      letter-spacing:.2px}
    .l-btn:hover{background:#1E3A8A;transform:translateY(-1px);
      box-shadow:0 4px 12px rgba(15,23,42,.3)}
    .l-btn:active{transform:translateY(0)}
    .l-btn:disabled{background:#94A3B8;cursor:not-allowed;transform:none;box-shadow:none}
    .l-err{background:#FEE2E2;color:#991B1B;border-radius:8px;
      padding:10px 14px;font-size:12px;font-weight:600;margin-bottom:14px;display:none;
      border:1px solid #FECACA}
    .l-msg{background:#EFF6FF;color:#1D4ED8;border-radius:8px;
      padding:10px 14px;font-size:12px;font-weight:600;margin-bottom:14px;
      border:1px solid #BFDBFE}
    .l-field{margin-bottom:18px}
    .pw-wrap{position:relative}
    .pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);
      border:none;background:none;cursor:pointer;color:#94A3B8;font-size:15px;padding:4px}
    .l-hint{text-align:center;margin-top:20px;font-size:11px;color:#94A3B8;line-height:1.5}
    /* Responsive */
    @media(max-width:768px){
      .l-left{display:none}
      .l-right{width:100%;padding:36px 24px}
    }
  </style>

function _togglePw() {
  const inp = document.getElementById('lPw');
  if(inp) inp.type = inp.type === 'password' ? 'text' : 'password';
}

async function _doLogin() {
  const email = document.getElementById('lEmail')?.value?.trim();
  const pw    = document.getElementById('lPw')?.value;
  const btn   = document.getElementById('lBtn');
  const err   = document.getElementById('lErr');

  if(!email || !pw) {
    err.textContent = 'Ingresa tu correo y contraseña.';
    err.style.display = 'block'; return;
  }

  btn.disabled = true;
  btn.textContent = 'Verificando…';
  err.style.display = 'none';

  const { data, error } = await _auth_sb.auth.signInWithPassword({ email, password: pw });

  if(error) {
    btn.disabled = false;
    btn.textContent = 'Entrar a Impulse';
    err.textContent = error.message.includes('Invalid') || error.message.includes('invalid')
      ? 'Correo o contraseña incorrectos.'
      : error.message;
    err.style.display = 'block';
    return;
  }

  _auth_session = data.session;
  const meta = data.user.user_metadata || {};

  if(meta.must_change_password) {
    showChangePassword(data.user);
    return;
  }

  _startApp(data.user);
}

function _pwStrength() {
  const pw  = document.getElementById('cpNew')?.value || '';
  const bar = document.getElementById('pwBar');
  const lbl = document.getElementById('pwLbl');
  if(!bar || !lbl) return;
  let s = 0;
  if(pw.length >= 8)  s++;
  if(pw.length >= 12) s++;
  if(/[A-Z]/.test(pw)) s++;
  if(/[0-9]/.test(pw)) s++;
  if(/[^A-Za-z0-9]/.test(pw)) s++;
  const levels = [
    {w:'0%',   bg:'#E2E8F0', l:''},
    {w:'20%',  bg:'#DC2626', l:'Muy débil'},
    {w:'40%',  bg:'#D97706', l:'Débil'},
    {w:'65%',  bg:'#EAB308', l:'Buena'},
    {w:'85%',  bg:'#22C55E', l:'Fuerte'},
    {w:'100%', bg:'#16A34A', l:'Muy fuerte'},
  ];
  const lvl = levels[Math.min(s, 5)];
  bar.style.width = lvl.w;
  bar.style.background = lvl.bg;
  lbl.textContent = lvl.l;
  lbl.style.color = lvl.bg;
}

async function _doChangePw() {
  const newPw  = document.getElementById('cpNew')?.value || '';
  const confPw = document.getElementById('cpConf')?.value || '';
  const btn    = document.getElementById('cpBtn');
  const err    = document.getElementById('cpErr');

  err.style.display = 'none';
  if(newPw.length < 8) {
    err.textContent = 'La contraseña debe tener al menos 8 caracteres.';
    err.style.display = 'block'; return;
  }
  if(newPw === '0000') {
    err.textContent = 'No puedes usar la contraseña temporal como tu nueva contraseña.';
    err.style.display = 'block'; return;
  }
  if(newPw !== confPw) {
    err.textContent = 'Las contraseñas no coinciden.';
    err.style.display = 'block'; return;
  }

  btn.disabled = true;
  btn.textContent = 'Guardando…';

  const { error } = await _auth_sb.auth.updateUser({
    password: newPw,
    data: { must_change_password: false }
  });

  if(error) {
    btn.disabled = false;
    btn.textContent = 'Guardar y entrar';
    err.textContent = 'Error: ' + error.message;
    err.style.display = 'block'; return;
  }

  _startApp(window._pendingUser);
}

// ── INICIAR APP ───────────────────────────────────────────────
function _startApp(user) {
  const meta   = user.user_metadata || {};
  const empId  = meta.employee_id;
  const role   = meta.system_role || 'agent';
  const nombre = meta.nombre || user.email;

  currentRole = role;
  ROLES[role] = { ...ROLES[role], name: nombre, id: empId,
    av: initials(nombre), label: ROLES[role]?.label || role };

  sessionStorage.setItem('impulse_user', JSON.stringify({
    email: user.email, empId, role, nombre, sessionStart: Date.now()
  }));

  _auth_sessionStart = Date.now();
  window._auth_loggedIn = true;
  roleSwitcher = function(){ return ''; };
  console.log('[Impulse] _startApp: role='+role+' empId='+empId);
  _buildAppShell();
  console.log('[Impulse] _buildAppShell OK, content='+!!document.getElementById('content'));
  _startClock();
  _startSecurityTimers();
  _startVersionCheck();
  console.log('[Impulse] switching to asistencia...');
  switchModule('asistencia');
}

let _clockInterval = null;
function _updateTopbarTime(){
  const now = new Date();
  const fecha = now.toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short',year:'numeric',timeZone:'America/Mexico_City'});
  const hora  = now.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',hour12:true,timeZone:'America/Mexico_City'});
  const el = document.getElementById('tbDate');
  if(el) el.textContent = fecha + ' · ' + hora;
}
function _startClock(){
  _updateTopbarTime();
  if(_clockInterval) clearInterval(_clockInterval);
  _clockInterval = setInterval(_updateTopbarTime, 60000);
}
function _stopClock(){
  if(_clockInterval){ clearInterval(_clockInterval); _clockInterval=null; }
}

// ── TIMERS DE SEGURIDAD ───────────────────────────────────────
function _startSecurityTimers() {
  const reset = () => {
    clearTimeout(_auth_idleTimer);
    _auth_idleTimer = setTimeout(() => _doLogout('Tu sesión expiró por inactividad (30 min).'), IDLE_MAX);
  };
  ['click','keydown','scroll','mousemove','touchstart'].forEach(ev =>
    document.addEventListener(ev, reset, { passive: true })
  );
  reset();
  clearTimeout(_auth_sessionTimer);
  _auth_sessionTimer = setTimeout(
    () => _doLogout('Tu sesión de 3 horas expiró. Inicia sesión de nuevo.'),
    SESSION_MAX
  );
}

async function _doLogout(msg) {
  msg = msg || '';
  clearTimeout(_auth_idleTimer);
  clearTimeout(_auth_sessionTimer);
  clearInterval(_auth_versionTimer);
  sessionStorage.removeItem('impulse_user');
  window._auth_loggedIn = false;
  _stopClock();
  await _auth_sb.auth.signOut();
  showLogin(msg);
}

// ── CHEQUEO DE VERSIÓN ────────────────────────────────────────
async function _checkVersion() {
  try {
    const { data } = await _auth_sb.from('app_config')
      .select('value').eq('key','version').single();
    if(data && data.value !== APP_VERSION) {
      const b = document.getElementById('updateBanner');
      if(b) b.style.display = 'block';
    }
  } catch(e) { /* silencioso */ }
}

function _startVersionCheck() {
  _checkVersion();
  _auth_versionTimer = setInterval(_checkVersion, VERSION_CHECK);
}

// ── ARRANQUE ──────────────────────────────────────────────────
async function _initImpulse() {
  // Revisar sesión guardada
  const saved = sessionStorage.getItem('impulse_user');
  if(saved) {
    try {
      const u = JSON.parse(saved);
      const elapsed = Date.now() - u.sessionStart;
      if(elapsed < SESSION_MAX) {
        const { data: { session } } = await _auth_sb.auth.getSession();
        if(session) {
          currentRole = u.role;
          ROLES[u.role] = { ...ROLES[u.role], name: u.nombre, id: u.empId,
            av: initials(u.nombre) };
          _auth_sessionStart = u.sessionStart;
          window._auth_loggedIn = true;
          roleSwitcher = function(){ return ''; };
          _buildAppShell();
          _startClock();
          _startSecurityTimers();
          _startVersionCheck();
          switchModule('asistencia');
          return;
        }
      }
    } catch(e) { /* sesión inválida */ }
    sessionStorage.removeItem('impulse_user');
  }
  showLogin();
}

// _a_dateFilter.mode: 'today' | 'week' | 'quincena' | 'month' | 'custom'
const _a_dateFilter = {
  mode: 'today',
  from: NOW.toISOString().split('T')[0],
  to:   NOW.toISOString().split('T')[0],
  label: 'Hoy'
};

function _a_setPreset(mode){
  const d = new Date(NOW);
  _a_dateFilter.mode = mode;
  if(mode==='today'){
    _a_dateFilter.from = ymd(d);
    _a_dateFilter.to   = ymd(d);
    _a_dateFilter.label = 'Hoy';
  } else if(mode==='week'){
    const mon = new Date(d); mon.setDate(d.getDate()-d.getDay()+1);
    _a_dateFilter.from = ymd(mon);
    _a_dateFilter.to   = ymd(d);
    _a_dateFilter.label = 'Esta semana';
  } else if(mode==='quincena'){
    const day = d.getDate();
    if(day<=15){
      _a_dateFilter.from = ymd(new Date(d.getFullYear(),d.getMonth(),1));
      _a_dateFilter.to   = ymd(new Date(d.getFullYear(),d.getMonth(),15));
      _a_dateFilter.label = 'Quincena 1';
    } else {
      _a_dateFilter.from = ymd(new Date(d.getFullYear(),d.getMonth(),16));
      _a_dateFilter.to   = ymd(new Date(d.getFullYear(),d.getMonth()+1,0));
      _a_dateFilter.label = 'Quincena 2';
    }
  } else if(mode==='month'){
    _a_dateFilter.from = ymd(new Date(d.getFullYear(),d.getMonth(),1));
    _a_dateFilter.to   = ymd(new Date(d.getFullYear(),d.getMonth()+1,0));
    _a_dateFilter.label = d.toLocaleDateString('es-MX',{month:'long',year:'numeric'});
  } else if(mode==='q_ant'){
    const day = d.getDate();
    if(day<=15){
      // quincena anterior = 16-fin mes pasado
      _a_dateFilter.from = ymd(new Date(d.getFullYear(),d.getMonth()-1,16));
      _a_dateFilter.to   = ymd(new Date(d.getFullYear(),d.getMonth(),0));
    } else {
      _a_dateFilter.from = ymd(new Date(d.getFullYear(),d.getMonth(),1));
      _a_dateFilter.to   = ymd(new Date(d.getFullYear(),d.getMonth(),15));
    }
    _a_dateFilter.label = 'Quincena anterior';
  }
  // sync inputs
  const fi = document.getElementById('dfFrom');
  const ti = document.getElementById('dfTo');
  if(fi) fi.value = _a_dateFilter.from;
  if(ti) ti.value = _a_dateFilter.to;
  _a_render();
}

function _a_applyCustom(){
  const fi = document.getElementById('dfFrom');
  const ti = document.getElementById('dfTo');
  if(!fi||!ti) return;
  if(!fi.value||!ti.value){ alert('Selecciona un rango de fechas'); return; }
  if(fi.value > ti.value){ alert('La fecha de inicio no puede ser mayor que la de fin'); return; }
  _a_dateFilter.mode  = 'custom';
  _a_dateFilter.from  = fi.value;
  _a_dateFilter.to    = ti.value;
  // Calcular días en rango
  const dias = Math.round((new Date(ti.value)-new Date(fi.value))/(1000*60*60*24))+1;
  _a_dateFilter.label = `${fmtDateShort(fi.value)} → ${fmtDateShort(ti.value)} (${dias}d)`;
  _a_render();
}

function fmtDateShort(ymdStr){
  return new Date(ymdStr+'T12:00:00').toLocaleDateString('es-MX',{day:'numeric',month:'short'});
}

// Cuántos días hay en el rango activo
function _a_rangeDays(){
  return Math.round((new Date(_a_dateFilter.to)-new Date(_a_dateFilter.from))/(1000*60*60*24))+1;
}

// Filtrar los días de quincena según el rango activo
function _a_filteredDays(){

async function _a_cargarDatos() {
  try {
    const ro = ROLES[currentRole];
    const hoy = ymd(NOW);

    // 1. Punch de hoy del usuario actual
    const { data: punches } = await _a_sb
      .from('attendance_punches')
      .select('punch_type, punch_time')
      .eq('employee_id', ro.id)
      .eq('punch_date', hoy)
      .order('punch_time');

    if (punches && punches.length > 0) {
      const entrada = punches.find(p => p.punch_type === 'entrada');
      const salida  = punches.find(p => p.punch_type === 'salida');
      const ps = _a_punchState[currentRole] || _a_punchState.agent;
      ps.entrada = entrada ? entrada.punch_time.slice(0,5) : null;
      ps.salida  = salida  ? salida.punch_time.slice(0,5)  : null;
    }

    // 2. Historial de la quincena (últimos 15 días)
    const quincenaStart = addDays(hoy, -14);
    const { data: summary } = await _a_sb
      .from('attendance_daily_summary')
      .select('*')
      .eq('employee_id', ro.id)
      .gte('punch_date', quincenaStart)
      .lte('punch_date', hoy)
      .order('punch_date');

    _a_QDAYS = [];
    // Generar todos los días del rango
    let cur = new Date(quincenaStart + 'T12:00:00');
    const end = new Date(hoy + 'T12:00:00');
    while (cur <= end) {
      const fecha = ymd(cur);
      const dow = cur.getDay();
      if (dow === 0 || dow === 6) {
        _a_QDAYS.push({ fecha, weekend: true });
      } else {
        const s = summary?.find(x => x.punch_date === fecha);
        _a_QDAYS.push({
          fecha,
          entrada_at:           s?.time_in    ? `${fecha}T${s.time_in}-06:00`   : null,
          salida_at:            s?.time_out   ? `${fecha}T${s.time_out}-06:00`  : null,
          segundos_trabajados:  s ? Math.round((s.hours_worked||0) * 3600) : 0,
          segundos_tarde:       s ? (s.minutes_late||0) * 60 : 0,
          es_retardo:           s ? (s.minutes_late||0) > 0 : false,
          estatus:              s?.attendance_status || (s ? 'Normal' : 'Sin registro'),
          tipo_falta:           s?.exception_type || null,
        });
      }
      cur.setDate(cur.getDate() + 1);
    }

    // 3. Equipo del supervisor (hoy)
    if (['supervisor','manager','people','head_people'].includes(currentRole)) {
      const { data: emps } = await _a_sb
        .from('employees')
        .select('id, full_name, campaign_id, shift_start, shift_end, shift_hours, supervisor_id')
        .eq('status','active')
        .eq(currentRole === 'supervisor' ? 'supervisor_id' : 'status', currentRole === 'supervisor' ? ro.id : 'active');

      const empList = currentRole === 'supervisor'
        ? (emps || [])
        : (emps || []).filter(e => e.supervisor_id !== null);

      // Cargar asistencia de hoy para el equipo
      const empIds = empList.map(e => e.id);
      let todaySummary = [];
      if (empIds.length > 0) {
        const { data: ts } = await _a_sb
          .from('attendance_daily_summary')
          .select('*')
          .eq('punch_date', hoy)
          .in('employee_id', empIds);
        todaySummary = ts || [];
      }

      _a_TEAM = empList.map(e => {
        const s = todaySummary.find(x => x.employee_id === e.id);
        const lateMin = s ? (s.minutes_late || 0) : 0;
        let status = 'sin_punch';
        if (s) {
          if (s.attendance_status === 'Falta injustificada' || s.exception_type === 'falta') status = 'falta';
          else if (lateMin > 0) status = 'late';
          else status = 'on_time';
        }
        return {
          id:         e.id,
          name:       e.full_name,
          camp:       e.campaign_id || '—',
          shift:      e.shift_start?.slice(0,5) || '—',
          shiftEnd:   e.shift_end?.slice(0,5)   || '—',
          shiftH:     Math.round(e.shift_hours || 9),
          status,
          late:       lateMin,
          lateMin,
          entrada:    s?.time_in?.slice(0,5)  || null,
          salida:     s?.time_out?.slice(0,5) || null,
          worked:     s ? Math.round((s.hours_worked||0)*3600) : null,
          lateSecs:   lateMin * 60,
          sanctions:  0, // se conectará con disciplinary_records
          salary:     0, // se conectará con employees_payroll
          retardos30: 0,
          faltas30:   0,
          falta:      status === 'falta' ? {
            categoria: s?.exception_type || 'falta_injustificada',
            estado:    s?.exception_status || 'falta_injustificada',
            motivo:    s?.notes || 'Sin registro',
            marcadaPor:'sistema', hora:'—', nota:''
          } : null,
        };
      });
    }

    // 4. KPIs globales para Head of People / People
    if (['people','head_people'].includes(currentRole)) {
      // Todos los empleados activos
      const { data: allEmps } = await _a_sb
        .from('employees')
        .select('id, full_name, campaign_id, supervisor_id, system_role, shift_start, shift_end')
        .eq('status','active');

      const allIds = (allEmps||[]).map(e=>e.id);
      const total = allIds.length;
      // Campañas únicas de los empleados
      _a_CAMPS_REAL = [...new Set((allEmps||[])
        .map(e=>e.campaign_id)
        .filter(Boolean)
      )].sort();

      // Asistencia de hoy de todos (en chunks de 100 por límite de Supabase)
      let todayAll = [];
      if (allIds.length > 0) {
        const chunkSize = 100;
        for (let ci = 0; ci < allIds.length; ci += chunkSize) {
          const chunk = allIds.slice(ci, ci + chunkSize);
          const { data: ts } = await _a_sb
            .from('attendance_daily_summary')
            .select('employee_id, minutes_late, attendance_status, time_in, time_out, hours_worked')
            .eq('punch_date', hoy)
            .in('employee_id', chunk);
          if (ts) todayAll = todayAll.concat(ts);
        }
      }

      // KPIs globales
      const onTime  = todayAll.filter(s => (s.minutes_late||0) === 0 && s.time_in).length;
      const late    = todayAll.filter(s => (s.minutes_late||0) > 0).length;
      const absent  = todayAll.filter(s => s.attendance_status === 'Falta injustificada').length;
      const noOut   = todayAll.filter(s => s.time_in && !s.time_out).length;
      _a_KPI_GLOBAL = { total, onTime, late, absent, noOut };

      // Heatmap por campaña
      _a_CAMP_REAL = {};
      (allEmps||[]).forEach(e => {
        const camp = e.campaign_id || 'admin';
        if (!_a_CAMP_REAL[camp]) _a_CAMP_REAL[camp] = { total:0, onTime:0, late:0, absent:0 };
        _a_CAMP_REAL[camp].total++;
        const s = todayAll.find(x => x.employee_id === e.id);
        if (s) {
          if ((s.minutes_late||0) > 0) _a_CAMP_REAL[camp].late++;
          else if (s.attendance_status === 'Falta injustificada') _a_CAMP_REAL[camp].absent++;
          else if (s.time_in) _a_CAMP_REAL[camp].onTime++;
        }
      });

      // Supervisores con asistencia de hoy
      const sups = (allEmps||[]).filter(e => e.system_role === 'supervisor');
      _a_SUPS_REAL = sups.map(e => {
        const s = todayAll.find(x => x.employee_id === e.id);
        const lateMin = s ? (s.minutes_late||0) : 0;
        const status = !s ? 'sin_punch' :
          (s.attendance_status==='Falta injustificada' ? 'falta' :
           lateMin > 0 ? 'late' : 'on_time');
        // Equipo de este supervisor
        const myTeam = (allEmps||[]).filter(a => a.supervisor_id === e.id);
        const teamToday = myTeam.map(a => todayAll.find(x=>x.employee_id===a.id)).filter(Boolean);
        return {
          id:    e.id,
          name:  e.full_name,
          camp:  (() => {
            if (e.campaign_id) return e.campaign_id;
            if (!myTeam.length) return 'admin';
            const freq = {};
            myTeam.forEach(a => { const c = a.campaign_id||'admin'; freq[c]=(freq[c]||0)+1; });
            return Object.entries(freq).sort((a,b)=>b[1]-a[1])[0][0];
          })(),
          shift: e.shift_start ? e.shift_start.slice(0,5) : '—',
          shiftEnd: e.shift_end ? e.shift_end.slice(0,5) : '—',
          agents: myTeam.length,
          onTime: teamToday.filter(s=>(s.minutes_late||0)===0&&s.time_in).length,
          late:   teamToday.filter(s=>(s.minutes_late||0)>0).length,
          absent: teamToday.filter(s=>s.attendance_status==='Falta injustificada').length,
          status, lateMin,
          entrada: s?.time_in?.slice(0,5) || null,
          salida:  s?.time_out?.slice(0,5) || null,
          avgQA: 0, retardos30: 0, faltas30: 0,
          hoursContracted: myTeam.length * 8,
          hoursWorked: Math.round(teamToday.reduce((sum,s)=>sum+(s.hours_worked||0),0)),
          bonusRisk: 0, costAusentismo: 0,
          noOut: teamToday.filter(s=>s.time_in&&!s.time_out).length,
          falta: status==='falta' ? {categoria:'falta_injustificada',estado:'falta_injustificada',motivo:'Sin registro',marcadaPor:'sistema',hora:'—'} : null,
          _teamIds:     myTeam.map(a=>a.id),
          _teamCamps:   [...new Set(myTeam.map(a=>a.campaign_id).filter(Boolean))],
          faltasTotal:  teamToday.filter(s=>s.attendance_status==='Falta injustificada').length,
          faltasPorSup: 0,
          faltasPorSistema: teamToday.filter(s=>s.attendance_status==='Falta injustificada').length,
          atencionScore: 100,
        };
      });
    }

    return true;
  } catch(err) {
    console.error('Error cargando asistencia:', err);
    return false;
  }
}

const _a_OT_LIMITE_DOBLE_SEMANAL = 9 * 60; // 540 minutos

function _a_calcOTPago(ot_mins, ot_semana_prev_mins, salary_monthly){
  const salary_hora = salary_monthly / 30 / 8;
  let pago = 0;
  let mins_doble = 0;
  let mins_triple = 0;

  const disponible_doble = Math.max(0, _a_OT_LIMITE_DOBLE_SEMANAL - ot_semana_prev_mins);

  if(ot_mins <= disponible_doble){
    mins_doble  = ot_mins;
    mins_triple = 0;
  } else {
    mins_doble  = disponible_doble;
    mins_triple = ot_mins - disponible_doble;
  }

  const pago_doble  = (mins_doble  / 60) * salary_hora * 2;
  const pago_triple = (mins_triple / 60) * salary_hora * 3;
  pago = pago_doble + pago_triple;

  return {
    pago: Math.round(pago),
    mins_doble,
    mins_triple,
    salary_hora: Math.round(salary_hora * 100) / 100,
    tasa: mins_triple > 0 ? (mins_doble > 0 ? 'mixta' : 'triple') : 'doble',
  };
}

  return m > 0 ? `${h}h ${m}m` : `${h}h`;
}

// ── OVERTIME MODULE — compartido entre vistas ────────────────────────────────
function _a_renderOTSection(rol){
  // CEO y People: solo mostrar si hay registros escalados sin aprobar
  const escalados = _a_OT_RECORDS.filter(r=>['escalated_manager','escalated_ceo'].includes(r.status)).length;
  if(['ceo','people'].includes(rol) && escalados===0) return '';

  let records = [..._a_OT_RECORDS];
  if(rol==='supervisor') records = records.filter(r=>['pending','approved','rejected'].includes(r.status));
  if(rol==='manager')    records = records.filter(r=>['escalated_manager','pending','approved'].includes(r.status));
  if(rol==='people')     records = records.filter(r=>['escalated_manager','escalated_ceo'].includes(r.status));
  if(rol==='ceo')        records = records.filter(r=>r.status==='escalated_ceo');

  const pendientes     = _a_OT_RECORDS.filter(r=>r.status==='pending').length;
  const porRevisar     = _a_OT_RECORDS.filter(r=>['pending','escalated_manager','escalated_ceo'].includes(r.status));
  const porRevisarMins = porRevisar.reduce((s,r)=>s+r.ot_mins,0);
  const aprobadoMins   = _a_OT_RECORDS.filter(r=>r.status==='approved').reduce((s,r)=>s+r.ot_mins,0);
  const sinGestionar   = escalados;

  const canApprove = (r) => {
    if(r.status==='pending'           && ['supervisor','head_people'].includes(rol)) return true;
    if(r.status==='escalated_manager' && rol==='manager')   return true;
    if(r.status==='escalated_ceo'     && rol==='ceo')       return true;
    return false;
  };

  let rows='';
  records.forEach(r=>{
    const st = _a_otStatusLabel(r.status);
    const accion = canApprove(r)
      ? `<div style="display:flex;gap:5px">
           <button onclick="_a_aprobarOT('${r.id}')" style="border:1px solid #86EFAC;background:#DCFCE7;color:#166534;border-radius:6px;padding:4px 9px;font-size:11px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif">✅ Aprobar</button>
           <button onclick="_a_rechazarOT('${r.id}')" style="border:1px solid #FCA5A5;background:#FEE2E2;color:#991B1B;border-radius:6px;padding:4px 9px;font-size:11px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif">❌ Rechazar</button>
         </div>`
      : `<span style="font-size:11px;color:#94A3B8">${r.aprobadoPor?'Por '+r.aprobadoPor:'—'}</span>`;

    rows+=`<tr>
      <td><div class="agent-row-name">${r.agentName}</div><div class="agent-row-id">${r.agentId}</div></td>
      <td style="font-size:12px;color:#475569">${r.fecha}</td>
      <td style="font-family:'DM Mono',monospace;font-weight:700">${_a_otMinsToStr(r.ot_mins)}</td>
      <td style="font-family:'DM Mono',monospace;font-size:11px;color:#64748B">${_a_otMinsToStr(r.ot_semana_prev)} acum.</td>
      <td>
        <span class="pill ${st.pill}">${st.icon} ${st.label}</span>
        ${r.diasRestantes>0&&r.status==='pending'?`<div style="font-size:10px;color:#94A3B8;margin-top:2px">Vence en ${r.diasRestantes}d</div>`:''}
      </td>
      <td style="font-size:11px;color:#64748B">${r.nota||'—'}</td>
      <td>${accion}</td>
    </tr>`;
  });

  // Scorecards — 3 para sup/manager/head, solo escalados para ceo/people
  const scorecards = ['ceo','people'].includes(rol)
    ? `<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px">
        <div class="kpi-box incard">
          <div class="kpi-lbl" style="margin-bottom:4px">Horas extra por revisar</div>
          <div style="font-size:18px;font-weight:800;color:#D97706">${_a_otMinsToStr(porRevisarMins)}</div>
          <div style="font-size:11px;color:#94A3B8;margin-top:2px">${porRevisar.length} registro${porRevisar.length!==1?'s':''} sin gestionar</div>
        </div>
        <div class="kpi-box incard">
          <div class="kpi-lbl" style="margin-bottom:4px">Horas aprobadas este mes</div>
          <div style="font-size:18px;font-weight:800;color:#16A34A">${_a_otMinsToStr(aprobadoMins)}</div>
        </div>
      </div>`
    : `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px">
        <div class="kpi-box incard">
          <div class="kpi-lbl" style="margin-bottom:4px">Horas extra por revisar</div>
          <div style="font-size:18px;font-weight:800;color:#D97706">${_a_otMinsToStr(porRevisarMins)}</div>
          <div style="font-size:11px;color:#94A3B8;margin-top:2px">${porRevisar.length} registro${porRevisar.length!==1?'s':''}</div>
        </div>
        <div class="kpi-box incard">
          <div class="kpi-lbl" style="margin-bottom:4px">Horas aprobadas este mes</div>
          <div style="font-size:18px;font-weight:800;color:#16A34A">${_a_otMinsToStr(aprobadoMins)}</div>
        </div>
        <div class="kpi-box incard">
          <div class="kpi-lbl" style="margin-bottom:4px">Sin gestionar</div>
          <div style="font-size:18px;font-weight:800;color:${sinGestionar>0?'#DC2626':'#16A34A'}">${sinGestionar}</div>
          <div style="font-size:11px;color:#94A3B8;margin-top:2px">${sinGestionar>0?'Escalados':'Al corriente'}</div>
        </div>
      </div>`;

  const titulo = ['ceo','people'].includes(rol)
    ? `⏱️ Tiempo extra escalado — sin aprobación del supervisor`
    : `⏱️ Tiempo extra · LFT México`;

  return`
  <div class="card" style="border-color:${['ceo','people'].includes(rol)?'#FCA5A5':pendientes>0?'#FDE68A':'#E2E8F0'}">
    <div class="card-title">${titulo}
      ${pendientes>0&&!['ceo','people'].includes(rol)?`<span class="pill pill-amber">${pendientes} pendiente${pendientes!==1?'s':''}</span>`:''}
      ${escalados>0?`<span class="pill pill-red">${escalados} escalado${escalados!==1?'s':''}</span>`:''}
    </div>
    ${scorecards}
    <div style="background:#EFF6FF;border:1px solid #BFDBFE;border-radius:8px;padding:9px 12px;font-size:12px;color:#1D4ED8;margin-bottom:12px">
      📋 <strong>LFT:</strong> 0–9h semanales = <strong>2× salario/hora.</strong> Hora 10 en adelante = <strong>3×.</strong> El supervisor tiene <strong>3 días</strong> para aprobar → escala a gerente → CEO.
    </div>
    <div class="tbl-wrap"><div style="overflow-x:auto"><table style="min-width:600px">
      <thead><tr><th>Agente</th><th>Fecha</th><th>Horas extra</th><th>Acum. semana</th><th>Status</th><th>Nota</th><th>Acción</th></tr></thead>
      <tbody>${rows||`<tr><td colspan="7" style="padding:16px;text-align:center;color:#94A3B8">Sin registros de overtime</td></tr>`}</tbody>
    </table></div></div>
  </div>`;
}

}

  cats.forEach(c=>{

      el.style.border   = `2px solid ${_a_CATEGORIA_CONFIG[c].border}`;

      el.style.opacity  = '1';

      el.style.opacity  = '.45';

}

  const sel = document.getElementById('falta-motivo');

    if(cat==='incapacidad'){
      // Forzar motivo a incapacidad y bloquear el select
      sel.value    = 'Se enfermó con incapacidad IMSS';
      sel.disabled = true;
      sel.style.background  = '#F1F5F9';
      sel.style.color       = '#64748B';
      sel.style.cursor      = 'not-allowed';

      // Restaurar select libre
      sel.disabled = false;
      sel.style.background  = '#fff';

      sel.style.cursor      = 'default';

function _a_onMotivoChange(motivo){
  if(!motivo) return;
  const cat = _a__catForzada || _a_categoriaFromMotivo(motivo);
  _a__catForzada = null;
  _a_highlightCard(cat);

  const sel = document.getElementById('falta-motivo');
  if(cat==='incapacidad' && sel){
    // Bloquear si el motivo elegido es de incapacidad
    sel.disabled = true;
    sel.style.background = '#F1F5F9';
    sel.style.color      = '#64748B';

  if(aviso) aviso.style.display = cat==='incapacidad' ? 'block' : 'none';

  const idx = _a_FALTAS_LOG.findIndex(f=>f.agentId===agentId&&f.fecha===fecha&&f.estado==='pendiente_comprobante');

  if(accion==='aprobar'){

    _a_FALTAS_LOG[idx].estado    = 'falta_injustificada';

    const por=falta.marcadaPor==='sistema'?' 🤖':' 👤';

    return`<span class="pill" style="background:${cfg.bg};color:${cfg.color};border:1px solid ${cfg.border}"><span class="dot"></span>${cfg.label}${pend}${por}</span>`;

  if(status==='late') return`<span class="pill pill-amber"><span class="dot"></span>Retardo</span>`;

    "</div>";
}

function _a_setFiltro(campo, valor) {
  _a_filtros[campo] = valor;
  _a_render();
}


function _a_aplicarFiltroTablas() {
  const camp = (_a_filtros.campana||'').toLowerCase();
  ['supBody','atencionBody','atencionBodyMain'].forEach(id => {
    const tbody = document.getElementById(id);
    if (!tbody) return;
    tbody.querySelectorAll('tr').forEach(row => {
      if (!camp) { row.style.display = ''; return; }
      const supName = row.querySelector('td:first-child .agent-row-name')?.textContent || '';
      const supData = _a_SUPS_REAL.find(s => s.name === supName);
      let show = false;
      if (supData) {
        const mc = (supData.camp||'').toLowerCase();
        const tc = (supData._teamCamps||[]).map(c=>(c||'').toLowerCase());
        show = mc.includes(camp) || tc.some(c=>c.includes(camp));
      } else {
        show = row.textContent.toLowerCase().includes(camp);
      }
      row.style.display = show ? '' : 'none';
    });
  });
}

// Filtrar filas del DOM sin re-renderizar (para el input de texto)
function _a_aplicarFiltroDOM() {
  const q = _a_filtros.agente.toLowerCase();
  // Filtrar filas de tablas visibles
  document.querySelectorAll('#teamBody tr, #supBody tr, #atencionBody tr, .sup-row').forEach(row => {
    const txt = row.textContent.toLowerCase();
    row.style.display = (!q || txt.includes(q)) ? '' : 'none';
  });
  // Actualizar contador
  const visible = document.querySelectorAll('#teamBody tr:not([style*="none"]), #supBody tr:not([style*="none"])').length;
  const el = document.getElementById('filtroCount');
  if (el && q) el.textContent = visible + ' resultado' + (visible!==1?'s':'');
  else if (el) el.textContent = '';
}


function _a_filtrarEquipo(lista) {
  if (!_a_filtros.campana) return lista;
  return lista.filter(a => (a.camp||'').toLowerCase().includes(_a_filtros.campana.toLowerCase()));
}

function _a_filtrarSups(lista) {
  if (!_a_filtros.campana) return lista;
  const c = _a_filtros.campana.toLowerCase();
  return lista.filter(s => {
    const mainCamp = (s.camp||'').toLowerCase();
    const teamCamps = (s._teamCamps||[]).map(x=>(x||'').toLowerCase());
    return mainCamp.includes(c) || teamCamps.some(x=>x.includes(c));
  });
}

function _a_renderHeadPeople(){
  // Calcular KPIs según filtros activos
  const hayFiltro = _a_filtros.supervisores.length || _a_filtros.campana;
  const supsFiltrados = _a_filtrarSups(_a_SUPS_REAL);
  let totAgents, totOnTime, totLate, totAbsent, totNoOut;
  if (hayFiltro && supsFiltrados.length > 0) {
    // KPIs del subconjunto filtrado
    totAgents = supsFiltrados.reduce((s,x)=>s+x.agents,0);
    totOnTime = supsFiltrados.reduce((s,x)=>s+x.onTime,0);
    totLate   = supsFiltrados.reduce((s,x)=>s+x.late,0);
    totAbsent = supsFiltrados.reduce((s,x)=>s+x.absent,0);
    totNoOut  = supsFiltrados.reduce((s,x)=>s+x.noOut,0);
  } else {
    totAgents = _a_KPI_GLOBAL.total;
    totOnTime = _a_KPI_GLOBAL.onTime;
    totLate   = _a_KPI_GLOBAL.late;
    totAbsent = _a_KPI_GLOBAL.absent;
    totNoOut  = _a_KPI_GLOBAL.noOut;
  }
  const pctGlobal = totAgents ? Math.round((totOnTime/totAgents)*100) : 0;
  const _a_SUPS_USE = _a_SUPS_REAL;
  const totHContr=totAgents*8;
  const totHWork=_a_SUPS_REAL.length>0
    ? _a_SUPS_REAL.reduce((s,sup)=>s+sup.hoursWorked,0)
    : Math.max(0, totAgents*8 - totAbsent*8 - Math.round(totLate*12));
  const eficGlobal=Math.round((totHWork/totHContr)*100);

  // Costo
  const salarioDiarioPromedio=14800/30;
  const costAus=Math.round(totAbsent*salarioDiarioPromedio);
  const costRet=Math.round(totLate*12*salarioDiarioPromedio/60/8); // ~12 min promedio

  // Rotación proyectada (basada en sanciones)
  const bajasProyectadas=_a_RIESGO.filter(r=>r.proxBaja).length;

  // Tendencias — solo el valor actual (sin histórico falso)
  const trendRet=[totLate];
  const trendFal=[totAbsent];

  // Heatmap por campaña
  // Heatmap: usar datos reales si disponibles, sino mock
  const campanas = Object.keys(_a_CAMP_REAL).length > 0

  let hmHTML='';
  campanas.forEach(c=>{

// Calcula días proyectados según fecha de pago y mes
function _n_calcDiasProyectados(fechaPago){
  const d = new Date(fechaPago+'T12:00:00');
  const dia = d.getDate();
  const mes = d.getMonth();
  const anio = d.getFullYear();
  // Último día del mes
  const ultimoDiaMes = new Date(anio, mes+1, 0).getDate();
  // Punto de quincena: si pago <= 15, el límite es 15; si > 15, el límite es fin de mes
  const limite = dia <= 15 ? 15 : ultimoDiaMes;
  // Si ya es el límite, no hay proyectados
  if(dia >= limite) return [];
  const proyectados = [];
  for(let i = dia+1; i <= limite; i++){
    proyectados.push(`${anio}-${String(mes+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`);
  }
  return proyectados;
}

async function _n_cargarDatos() {
  try {
    // 1. Periodos de nómina
    const { data: periodos, error: e1 } = await _n_sb
      .from('payroll_periods')
      .select('*')

      fecha_inicio:    p.period_start,

      fecha_pago:      p.payment_date,
      dias_proyectados: _n_calcDiasProyectados(p.payment_date),
      status:          p.status || 'open',
      total_bruto:     0,
      total_ajustes:   0,
      total_neto:      0,
      created_by:      p.closed_by || '—',
    }));

    // Activar el primer periodo open o el más reciente
    const openPeriod = _n_PERIODOS.find(p => p.status === 'open' || p.status === 'review');
    _n_periodoActivo = openPeriod?.id || _n_PERIODOS[0]?.id || null;

    // 2. Empleados activos con salario
    const { data: emps } = await _n_sb
      .from('employees')
      .select('id, full_name, campaign_id, supervisor_id')
      .eq('status','active');

    const { data: payroll } = await _n_sb
      .from('employees_payroll')
      .select('employee_id, salary_monthly');

    const salaryMap = {};
    if (payroll) payroll.forEach(p => { salaryMap[p.employee_id] = p.salary_monthly || 0; });

    const idToSup = {};
    if (emps) emps.forEach(e => { idToSup[e.id] = e.supervisor_id; });

    _n_AGENTES = (emps || []).map(e => ({
      id:             e.id,
      name:           e.full_name,
      camp:           e.campaign_id || 'admin',
      sup:            e.supervisor_id,

      retardos:       0,
      faltas:         0,
      ot_mins:        0,
      ot_aprobado:    0,
      comision:       0,
      bonus_override: null,
      adj_anterior:   0,
    }));

    // 3. Cargar líneas del periodo activo
    if (_n_periodoActivo) {
      await _n_cargarLineas(_n_periodoActivo);
    }

    return true;
  } catch(err) {
    console.error('Error cargando nómina:', err);
    return false;
  }
}

async function _n_cargarLineas(periodoId) {
  const { data: lineas } = await _n_sb
    .from('payroll_lines')
    .select('*')
    .eq('period_id', periodoId);

  if (lineas && lineas.length > 0) {
    _n_LINEAS[periodoId] = lineas;
    // Actualizar totales del periodo
    const p = _n_PERIODOS.find(x => x.id === periodoId);
    if (p) {
      p.total_bruto  = lineas.reduce((s, l) => s + (l.gross_pay || 0), 0);
      p.total_ajustes= lineas.reduce((s, l) => s + (l.other_deductions || 0), 0);
      p.total_neto   = lineas.reduce((s, l) => s + (l.net_pay || 0), 0);
    }
    // Sincronizar retardos/faltas/OT en _n_AGENTES desde las líneas
    lineas.forEach(l => {
      const ag = _n_AGENTES.find(a => a.id === l.employee_id);
      if (ag) {
        ag.retardos     = l.late_count      || 0;
        ag.faltas       = l.days_absent     || 0;
        ag.ot_aprobado  = Math.round((l.overtime_hours || 0) * 60);
        ag.comision     = l.commission_amount || 0;
        ag.adj_anterior = l.other_deductions  || 0;
      }
    });
  } else {
    _n_LINEAS[periodoId] = [];
  }
}



// ── CÁLCULO DE LÍNEAS ──────────────────────────────────────────────────────
function _n_calcLinea(agente, periodo){
  const p = _n_PERIODOS.find(x=>x.id===periodo.id);
  // Días naturales del periodo (excluyendo proyectados, que se pagan pero pueden ajustarse)
  const inicio = new Date(p.fecha_inicio+'T12:00:00');
  const corte  = new Date(p.fecha_corte+'T12:00:00');
  const diasPeriodo = Math.round((corte - inicio)/(1000*60*60*24)) + 1;
  const diasProyectados = p.dias_proyectados.length;
  const diasTotales = diasPeriodo + diasProyectados;
  const diasTrabajados = diasTotales - agente.faltas;

  const salarioDiario = agente.salary / 30;
  const sueldo_base   = Math.round(salarioDiario * diasTrabajados);

  // Bono: solo si tiene 0 retardos Y 0 faltas
  const c = _n_CAMPANAS[agente.camp];
  const tieneBonoBase = c.bonus && agente.retardos === 0 && agente.faltas === 0;
  const bono = tieneBonoBase ? Math.round(agente.salary * _n_BONOS_CAMP[agente.camp]) : 0;
  const perdio_bono = c.bonus && !tieneBonoBase;

  // OT aprobado en este periodo
  const salary_hora = agente.salary / 30 / 8;
  const ot_horas = agente.ot_aprobado / 60;
  const ot_pago  = Math.round(ot_horas * salary_hora * 2); // simplificado: doble

  // Comisiones (cargadas por supervisor)
  const comision = agente.comision || 0;

  // Ajustes del periodo anterior
  const adj = agente.adj_anterior || 0;

  const total_bruto  = sueldo_base + bono + ot_pago + comision;
  const total_neto   = total_bruto + adj; // adj puede ser negativo

  // Anomalías
  const anomalias = [];
  if(agente.faltas > 0)      anomalias.push(`${agente.faltas} falta${agente.faltas>1?'s':''}`);
  if(agente.retardos >= 3)   anomalias.push(`${agente.retardos} retardos`);
  if(adj < 0)                anomalias.push('ajuste período ant.');
  if(agente.ot_mins > 0 && agente.ot_aprobado === 0) anomalias.push('OT pendiente');

  return {
    diasTotales, diasTrabajados, diasProyectados,
    salarioDiario: Math.round(salarioDiario),
    sueldo_base, bono, perdio_bono, ot_pago, ot_horas,
    comision, adj, total_bruto, total_neto, anomalias,
    tieneBonoBase,
  };
}

  ${anomalias.length>0?`<div class="alert alert-amber">⚠️ <strong>${anomalias.length} línea${anomalias.length>1?'s':''} con anomalías</strong> — revisa antes de cerrar. Las filas amarillas tienen retardos, faltas, ajustes o OT pendiente.</div>`:''}

  <!-- KPIs -->

    <div class="kbox ok"><div class="klabel">Total neto a pagar</div><div class="kval" style="font-size:18px;color:#16A34A">${pesos(totalNeto)}</div></div>
    <div class="kbox ${anomalias.length>0?'warn':'ok'}"><div class="klabel">Líneas con anomalías</div><div class="kval" style="color:${anomalias.length>0?'#D97706':'#16A34A'}">${anomalias.length}</div><div class="kdelta ${anomalias.length>0?'w':'up'}">${anomalias.length>0?'Requieren revisión':'Todo en orden'}</div></div>

  <!-- Tabla de líneas -->

    <thead><tr>
      <th>Agente</th><th>Campaña</th><th>Días trab.</th><th>Retardos</th><th>Faltas</th>
      <th>Bono</th><th>Sueldo base</th><th>Bono $</th><th>OT aprobado</th>
      <th>Comisión</th><th>Ajuste ant.</th><th>Neto</th><th>Status</th>
    </tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr style="background:#F8FAFC;font-weight:700">
      <td colspan="6">TOTALES</td>
      <td class="tm">${pesos(lineas.reduce((s,{l})=>s+l.sueldo_base,0))}</td>
      <td class="tm" style="color:#16A34A">${pesos(lineas.reduce((s,{l})=>s+l.bono,0))}</td>

// CEO — costo total por campaña
// ─────────────────────────────────────────────────────────────
function _n_renderCEO(){
  const p    = _n_PERIODOS.find(x=>x.id===_n_periodoActivo);
  if(!p) return `${roleSwitcher()}<div style="text-align:center;padding:60px;color:#94A3B8"><p>Cargando nómina...</p></div>`;
  const pAnt = _n_PERIODOS.find(x=>x.id!==_n_periodoActivo && (x.status==='closed'||x.status==='review'));
  const lineas    = _n_AGENTES.map(a=>({a, l:_n_calcLinea(a,p)}));
  const totalNeto = lineas.reduce((s,{l})=>s+l.total_neto,0);
  const totalBonos = lineas.reduce((s,{l})=>s+l.bono,0);
  const totalOT    = lineas.reduce((s,{l})=>s+l.ot_pago,0);
  const totalComm  = lineas.reduce((s,{l})=>s+l.comision,0);
  const totalAdj   = lineas.reduce((s,{l})=>s+l.adj,0);
  const totalBase  = lineas.reduce((s,{l})=>s+l.sueldo_base,0);

  // Datos del periodo anterior (mock basado en _n_PERIODOS data)
  const netoAnt   = pAnt?.total_neto || 1786150;
  const agAnt     = _n_AGENTES.length; // mismo equipo en demo
  const bonosAnt  = 87300;
  const otAnt     = 0;
  const commAnt   = 8200;
  const adjAnt    = -12300;
  const baseAnt   = netoAnt - bonosAnt - otAnt - commAnt - adjAnt;

  // Diferencias
  const diffTotal  = totalNeto - netoAnt;
  const diffBase   = totalBase - baseAnt;
  const diffBonos  = totalBonos - bonosAnt;
  const diffOT     = totalOT - otAnt;
  const diffComm   = totalComm - commAnt;
  const diffAdj    = totalAdj - adjAnt;
  const diffAgentes= _n_AGENTES.length - agAnt;

  function diffTag(val, invert=false){
    const color = (val>0&&!invert)||(val<0&&invert) ? '#16A34A' : val===0 ? '#94A3B8' : '#DC2626';
    const arrow = val>0 ? '↑' : val<0 ? '↓' : '→';
    return`<span style="font-size:12px;font-weight:700;color:${color}">${arrow} ${pesos(Math.abs(val))}</span>`;
  }
  function diffTagN(val){
    const color = val>0?'#16A34A':val<0?'#DC2626':'#94A3B8';
    const arrow = val>0?'↑':val<0?'↓':'→';
    return`<span style="font-size:12px;font-weight:700;color:${color}">${arrow} ${Math.abs(val)}</span>`;
  }

  // Agrupar por campaña
  const porCamp = {};
  lineas.forEach(({a,l})=>{
    if(!porCamp[a.camp]) porCamp[a.camp]={agentes:0,bruto:0,bonos:0,ot:0,comisiones:0,neto:0};
    porCamp[a.camp].agentes++;
    porCamp[a.camp].bruto+=l.total_bruto;
    porCamp[a.camp].bonos+=l.bono;
    porCamp[a.camp].ot+=l.ot_pago;
    porCamp[a.camp].comisiones+=l.comision;
    porCamp[a.camp].neto+=l.total_neto;
  });

  let campRows='';
  Object.entries(porCamp).forEach(([camp,d])=>{
    campRows+=`<tr>
      <td style="font-weight:700;color:#0F172A">${_n_CAMPANAS[camp]?.label||camp}</td>
      <td class="tm">${d.agentes}</td>
      <td class="tm">${pesos(d.bruto)}</td>
      <td class="tm" style="color:#16A34A">${d.bonos>0?pesos(d.bonos):'—'}</td>
      <td class="tm" style="color:#7E22CE">${d.ot>0?pesos(d.ot):'—'}</td>
      <td class="tm" style="color:#1D4ED8">${d.comisiones>0?pesos(d.comisiones):'—'}</td>
      <td class="tm" style="font-weight:800">${pesos(d.neto)}</td>
      <td class="tm" style="color:#64748B">${pesos(Math.round(d.neto/d.agentes))}</td>
    </tr>`;
  });

  return`${roleSwitcher()}
  ${_n_periodoSelector()}

  <!-- KPIs principales -->
  <div class="kgrid kg4">
    <div class="kbox">
      <div class="klabel">Total nómina</div>
      <div class="kval" style="font-size:18px">${pesos(totalNeto)}</div>
      <div style="margin-top:4px;display:flex;align-items:center;gap:6px">
        ${diffTag(diffTotal)}
        <span style="font-size:11px;color:#64748B">vs periodo ant.</span>
      </div>
    </div>
    <div class="kbox">
      <div class="klabel">Agentes a pagar</div>
      <div class="kval">${_n_AGENTES.length}</div>
      ${diffAgentes!==0?`<div style="margin-top:4px">${diffTagN(diffAgentes)} <span style="font-size:11px;color:#64748B">vs periodo ant.</span></div>`:`<div class="kdelta" style="color:#94A3B8">Mismo equipo</div>`}
    </div>
    <div class="kbox">
      <div class="klabel">Bonos pagados</div>
      <div class="kval" style="color:#16A34A">${pesos(totalBonos)}</div>
      <div style="margin-top:4px;display:flex;align-items:center;gap:6px">
        ${diffTag(diffBonos)}
        <span style="font-size:11px;color:#64748B">vs periodo ant.</span>
      </div>
    </div>
    <div class="kbox">
      <div class="klabel">OT aprobado</div>
      <div class="kval" style="color:#7E22CE">${pesos(totalOT)}</div>
      <div style="margin-top:4px;display:flex;align-items:center;gap:6px">
        ${diffTag(diffOT)}
        <span style="font-size:11px;color:#64748B">vs periodo ant.</span>
      </div>
    </div>
  </div>

  <!-- Comparativa vs periodo anterior — de dónde viene la diferencia -->
  <div class="card">
    <div class="card-title">
      📊 ¿Por qué cambió la nómina?
      <span style="font-size:12px;font-weight:400;color:#64748B">${p.nombre} vs ${pAnt?.nombre||'Periodo anterior'}</span>
      <span style="font-size:13px;font-weight:800;color:${diffTotal>=0?'#16A34A':'#DC2626'};margin-left:auto">${diffTotal>=0?'+':''}${pesos(diffTotal)}</span>
    </div>

    <!-- Barra visual de composición del cambio -->
    <div style="margin-bottom:16px">
      ${[
        {label:'Sueldo base',    val:diffBase,  color:'#3B82F6', icon:'💼'},
        {label:'Bonos',          val:diffBonos, color:'#16A34A', icon:'⭐'},
        {label:'Overtime',       val:diffOT,    color:'#7E22CE', icon:'⏱️'},
        {label:'Comisiones',     val:diffComm,  color:'#1D4ED8', icon:'💼'},
        {label:'Ajustes ant.',   val:diffAdj,   color:'#DC2626', icon:'⚖️'},
      ].map(item=>{
        const isPos = item.val >= 0;
        const color = isPos ? item.color : '#DC2626';
        const pctBar = Math.min(100, Math.abs(item.val) / Math.max(Math.abs(diffTotal),1) * 100);
        return`<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
          <div style="width:110px;font-size:12px;color:#475569;display:flex;align-items:center;gap:4px">
            <span>${item.icon}</span><span>${item.label}</span>
          </div>
          <div style="flex:1;height:24px;background:#F1F5F9;border-radius:6px;overflow:hidden;position:relative">
            <div style="position:absolute;${isPos?'left:0':'right:0'};top:0;height:100%;width:${pctBar}%;background:${color};border-radius:6px;opacity:.85"></div>
          </div>
          <div style="width:100px;text-align:right;font-family:var(--fm);font-size:12px;font-weight:700;color:${color}">
            ${isPos?'+':''}${pesos(item.val)}
          </div>
        </div>`;
      }).join('')}
    </div>

    <!-- Tabla de desglose -->
    <div class="tw">
      <table>
        <thead><tr>
          <th>Concepto</th>
          <th>Periodo anterior</th>
          <th>Este periodo</th>
          <th>Diferencia</th>
          <th>¿Por qué?</th>
        </tr></thead>
        <tbody>
          <tr>
            <td><strong>Sueldo base</strong></td>
            <td class="tm">${pesos(baseAnt)}</td>
            <td class="tm">${pesos(totalBase)}</td>
            <td class="tm">${diffTag(diffBase)}</td>
            <td style="font-size:11px;color:#64748B">${diffBase>0?'Más días trabajados / menos faltas':diffBase<0?'Más faltas o ausencias':'Sin cambio'}</td>
          </tr>
          <tr>
            <td><strong>Bonos</strong><br><span style="font-size:10px;color:#94A3B8">Aplazo + Stori</span></td>
            <td class="tm">${pesos(bonosAnt)}</td>
            <td class="tm">${pesos(totalBonos)}</td>
            <td class="tm">${diffTag(diffBonos)}</td>
            <td style="font-size:11px;color:#64748B">${diffBonos>0?`Más agentes con bono este periodo`:diffBonos<0?`Más agentes perdieron el bono (retardos/faltas)`:'Sin cambio en bonos'}</td>
          </tr>
          <tr>
            <td><strong>Overtime</strong><br><span style="font-size:10px;color:#94A3B8">LFT: 2× / 3×</span></td>
            <td class="tm">${pesos(otAnt)}</td>
            <td class="tm">${pesos(totalOT)}</td>
            <td class="tm">${diffTag(diffOT)}</td>
            <td style="font-size:11px;color:#64748B">${diffOT>0?`${lineas.filter(({l})=>l.ot_pago>0).length} agentes con OT aprobado`:diffOT<0?`Menos OT aprobado este periodo`:'Sin OT este periodo'}</td>
          </tr>
          <tr>
            <td><strong>Comisiones</strong><br><span style="font-size:10px;color:#94A3B8">iForex + KAMs</span></td>
            <td class="tm">${pesos(commAnt)}</td>
            <td class="tm">${pesos(totalComm)}</td>
            <td class="tm">${diffTag(diffComm)}</td>
            <td style="font-size:11px;color:#64748B">${diffComm>0?`Comisiones más altas este periodo`:diffComm<0?`Comisiones más bajas`:'Sin cambio'}</td>
          </tr>
          <tr>
            <td><strong>Ajustes período ant.</strong><br><span style="font-size:10px;color:#94A3B8">Faltas en días proy.</span></td>
            <td class="tm">${pesos(adjAnt)}</td>
            <td class="tm">${pesos(totalAdj)}</td>
            <td class="tm">${diffTag(diffAdj, true)}</td>
            <td style="font-size:11px;color:#64748B">${totalAdj<0?`Descuentos por faltas en días proyectados`:'Sin descuentos pendientes'}</td>
          </tr>
          <tr style="background:#0F172A">
            <td style="color:#fff;font-weight:700">TOTAL NETO</td>
            <td class="tm" style="color:#fff">${pesos(netoAnt)}</td>
            <td class="tm" style="color:#62D3F5;font-weight:800">${pesos(totalNeto)}</td>
            <td class="tm"><span style="font-size:14px;font-weight:800;color:${diffTotal>=0?'#62D3F5':'#FCA5A5'}">${diffTotal>=0?'+':''}${pesos(diffTotal)}</span></td>
            <td style="color:rgba(255,255,255,.5);font-size:11px">${Math.abs(Math.round(diffTotal/netoAnt*100))}% ${diffTotal>=0?'más':'menos'} que el periodo anterior</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Desglose por campaña -->
  <div class="sh"><div class="sh-t">Desglose por campaña · ${p.nombre}</div></div>
  <div class="tw"><table style="min-width:600px">
    <thead><tr><th>Campaña</th><th>Agentes a pagar</th><th>Bruto</th><th>Bonos</th><th>OT</th><th>Comisiones</th><th>Neto total</th><th>Costo x agente</th></tr></thead>
    <tbody>${campRows}</tbody>
    <tfoot><tr style="background:#F8FAFC;font-weight:700">
      <td>TOTAL</td>
      <td class="tm">${_n_AGENTES.length}</td>
      <td class="tm">${pesos(lineas.reduce((s,{l})=>s+l.total_bruto,0))}</td>
      <td class="tm" style="color:#16A34A">${pesos(totalBonos)}</td>
      <td class="tm" style="color:#7E22CE">${pesos(totalOT)}</td>
      <td class="tm" style="color:#1D4ED8">${pesos(totalComm)}</td>
      <td class="tm" style="font-size:14px">${pesos(totalNeto)}</td>
      <td class="tm">${pesos(Math.round(totalNeto/_n_AGENTES.length))}</td>
    </tfoot>
  </table></div>

  <!-- Historial -->
  <div class="sh"><div class="sh-t">Historial de periodos</div></div>
  <div class="tw"><table>
    <thead><tr><th>Periodo</th><th>Fecha de pago</th><th>Días proyectados</th><th>Neto pagado</th><th>Status</th></tr></thead>
    <tbody>
      ${_n_PERIODOS.map(pp=>`<tr onclick="_n_setPeriodo('${pp.id}')" style="cursor:pointer">
        <td class="tn">${pp.nombre}</td>
        <td class="tm">${_n_fmt(pp.fecha_pago)}</td>
        <td class="tm">${pp.dias_proyectados.length>0?`${pp.dias_proyectados.length} días`:'—'}</td>
        <td class="tm" style="font-weight:700">${pp.total_neto>0?pesos(pp.total_neto):'En proceso'}</td>
        <td>${_n_statusPeriodo(pp.status)}</td>
      </tr>`).join('')}
    </tbody>
  </table></div>`;
}

// ── ACCIONES ───────────────────────────────────────────────────────────────
function _n_moverARevision(){
  const p = _n_PERIODOS.find(x=>x.id===_n_periodoActivo);
  if(p) p.status='review';
  _n_render();
}
function _n_cerrarPeriodo(){
  const p = _n_PERIODOS.find(x=>x.id===_n_periodoActivo);
  if(!p) return;
  // Calcular totales reales
  const lineas = _n_AGENTES.map(a=>_n_calcLinea(a,p));
  p.total_bruto   = lineas.reduce((s,l)=>s+l.total_bruto,0);
  p.total_ajustes = lineas.reduce((s,l)=>s+l.adj,0);
  p.total_neto    = lineas.reduce((s,l)=>s+l.total_neto,0);
  p.status = 'closed';
  _n_render();
}
function _n_exportarNomina(){
  alert('En producción esto genera un CSV con CLABE, nombre e importe para enviar al banco. Por ahora es solo demo.');
}

function _n_cargarComision(agentId){
  const a = _n_AGENTES.find(x=>x.id===agentId);
  if(!a) return;
  document.getElementById('modalTitle').textContent='Cargar comisión';
  document.getElementById('modalSub').textContent=`${a.name} · ${_n_CAMPANAS[a.camp].label}`;
  document.getElementById('modalBody').innerHTML=`
    <div class="modal-section">
      <div class="ms-title">Monto de comisión</div>
      <div class="form-row">
        <label>Importe ($)</label>
        <input type="number" id="comm-amount" placeholder="0.00" value="${a.comision||''}" min="0" step="100"/>
      </div>
      <div class="form-row">
        <label>Concepto</label>
        <input type="text" id="comm-concepto" placeholder="Ej: Comisión iForex May 2026" value=""/>
      </div>
    </div>
    <div class="modal-section" style="background:#F0FDF4;border-color:#BBF7D0">
      <div class="kv"><div class="k">Agente</div><div class="v">${a.name} · ${a.id}</div></div>
      <div class="kv"><div class="k">Campaña</div><div class="v">${_n_CAMPANAS[a.camp].label}</div></div>
      <div class="kv"><div class="k">Periodo</div><div class="v">${_n_PERIODOS.find(p=>p.id===_n_periodoActivo)?.nombre}</div></div>
    </div>`;
  document.getElementById('modalFooter').innerHTML=`
    <button class="btn-ghost" onclick="closeModal()">Cancelar</button>
    <button class="btn-primary" onclick="_n_guardarComision('${agentId}')">Guardar</button>`;
  document.getElementById('modalBackdrop').style.display='flex';
}

function _n_guardarComision(agentId){
  const a = _n_AGENTES.find(x=>x.id===agentId);
  const val = parseFloat(document.getElementById('comm-amount')?.value||'0');
  if(!a||isNaN(val)) return;
  a.comision = val;
  closeModal();
  _n_render();
}

function _n_previewProyectados(){
  const pago = document.getElementById('np-pago')?.value;
  if(!pago) return;
  const proy = _n_calcDiasProyectados(pago);
  const el = document.getElementById('np-proyectados-txt');
  if(!el) return;
  el.innerHTML = proy.length>0
    ? `Se pagarán por adelantado: <strong>${proy.map(d=>_n_fmt(d)).join(', ')}</strong> (${proy.length} día${proy.length>1?'s':''}). Si hay faltas en esos días → descuento en el siguiente periodo.`
    : `<span style="color:#16A34A">Sin días proyectados — la fecha de pago coincide con el fin del periodo.</span>`;
}

function _n_crearPeriodo(){
  const nombre = document.getElementById('np-nombre')?.value;
  const inicio = document.getElementById('np-inicio')?.value;
  const corte  = document.getElementById('np-corte')?.value;
  const pago   = document.getElementById('np-pago')?.value;
  if(!nombre||!inicio||!corte||!pago){ alert('Completa todos los campos'); return; }
  const newP = {
    id: 'NOM-'+Date.now(),
    nombre, fecha_inicio:inicio, fecha_corte:corte, fecha_pago:pago,
    dias_proyectados: _n_calcDiasProyectados(pago),
    status:'open', total_bruto:0, total_ajustes:0, total_neto:0,
    created_by: ROLES[currentRole].name,
  };
  _n_PERIODOS.unshift(newP);
  _n_periodoActivo = newP.id;
  closeModal();
  _n_render();
}

function _q_render() {
  const c = document.getElementById('content');

}

function _q_switchTab(tabId) {
  _q_activeTab = tabId;
  document.querySelectorAll('[id^="qa-tab-btn-"]').forEach(function(btn) {
    const active = btn.id === 'qa-tab-btn-' + tabId;
    btn.style.borderBottomColor = active ? '#0F172A' : 'transparent';
    btn.style.color = active ? '#0F172A' : '#94A3B8';
  });
  _q_loadTab(tabId);
}

function _q_injectStyle(id, css) {
  let el = document.getElementById(id);

}

async function _q_loadTab(tabId) {
  const container = document.getElementById('qa-tab-content');
  if (!container) return;
  container.innerHTML = '<div style="text-align:center;padding:50px;color:#94A3B8"><div style="width:32px;height:32px;border:3px solid #E2E8F0;border-top-color:#62D3F5;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px"></div>Cargando...</div>';
  try {
    if (tabId === 'desempeno') await _q_loadDesempeno(container);
    else if (tabId === 'dashboard') await _q_loadDashboard(container);
    else if (tabId === 'manager') await _q_loadManagerPanel(container);
    else if (tabId === 'evalform') await _q_loadEvalForm(container);
  } catch(e) {
    console.error('[QA] Error en tab ' + tabId, e);
    container.innerHTML = '<div style="text-align:center;padding:40px;color:#DC2626">Error: ' + e.message + '</div>';
  }
}

async function _q_loadDesempeno(container) {
  const ro = ROLES[currentRole];
  const empId = ro ? ro.id : null;
  if (!empId) {
    container.innerHTML = '<div style="text-align:center;padding:60px;color:#94A3B8">Sin ID de empleado</div>';
    return;
  }
  const { data, error } = await _q_sb.from('qa_v_evaluations_base')
    .select('*').eq('agent_identifier', empId)
    .order('interaction_date', {ascending:false}).limit(100);
  if (error) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:#DC2626">Error: ' + error.message + '</div>';
    return;
  }
  const evals = data || [];
  if (!evals.length) {
    container.innerHTML = '<div style="text-align:center;padding:60px;color:#94A3B8"><div style="font-size:40px;margin-bottom:12px">⭐</div><p style="font-weight:600">Sin evaluaciones registradas</p></div>';
    return;
  }
  const avg = evals.reduce(function(s,e){ return s + (e.score_final||0); }, 0) / evals.length;
  let rows = '';
  evals.forEach(function(e) {
    const sc = e.score_final || 0;
    const color = sc >= 85 ? '#16A34A' : sc >= 70 ? '#D97706' : '#DC2626';
    rows += '<tr style="border-top:1px solid #F1F5F9"><td style="padding:10px 14px;font-size:13px">' + (e.interaction_date||'—') + '</td><td style="padding:10px 14px;font-size:13px">' + (e.campaign_name||e.campaign_key||'—') + '</td><td style="padding:10px 14px;font-size:13px;font-weight:700;color:' + color + '">' + sc.toFixed(1) + '%</td><td style="padding:10px 14px;font-size:13px;color:#64748B">' + (e.evaluator_name||'—') + '</td><td style="padding:10px 14px;font-size:13px;color:#64748B">' + (e.contact_type||'—') + '</td></tr>';
  });
  container.innerHTML = '<div style="max-width:960px;margin:0 auto"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px"><div style="background:#fff;border-radius:12px;padding:18px;border:1px solid #E2E8F0"><div style="font-size:28px;font-weight:800;color:' + (avg>=85?'#16A34A':avg>=70?'#D97706':'#DC2626') + '">' + avg.toFixed(1) + '%</div><div style="font-size:11px;color:#64748B;text-transform:uppercase;letter-spacing:.5px;margin-top:4px">Promedio general</div></div><div style="background:#fff;border-radius:12px;padding:18px;border:1px solid #E2E8F0"><div style="font-size:28px;font-weight:800;color:#0F172A">' + evals.length + '</div><div style="font-size:11px;color:#64748B;text-transform:uppercase;letter-spacing:.5px;margin-top:4px">Evaluaciones</div></div><div style="background:#fff;border-radius:12px;padding:18px;border:1px solid #E2E8F0"><div style="font-size:28px;font-weight:800;color:' + (evals.filter(function(e){return e.critical_error_triggered;}).length>0?'#DC2626':'#16A34A') + '">' + evals.filter(function(e){return e.critical_error_triggered;}).length + '</div><div style="font-size:11px;color:#64748B;text-transform:uppercase;letter-spacing:.5px;margin-top:4px">Errores críticos</div></div></div><div style="background:#fff;border-radius:12px;border:1px solid #E2E8F0;overflow:hidden"><table style="width:100%;border-collapse:collapse"><thead style="background:#F8FAFC"><tr><th style="padding:10px 14px;text-align:left;font-size:11px;color:#64748B;font-weight:600;text-transform:uppercase">Fecha</th><th style="padding:10px 14px;text-align:left;font-size:11px;color:#64748B;font-weight:600;text-transform:uppercase">Campaña</th><th style="padding:10px 14px;text-align:left;font-size:11px;color:#64748B;font-weight:600;text-transform:uppercase">Score</th><th style="padding:10px 14px;text-align:left;font-size:11px;color:#64748B;font-weight:600;text-transform:uppercase">Evaluador</th><th style="padding:10px 14px;text-align:left;font-size:11px;color:#64748B;font-weight:600;text-transform:uppercase">Tipo</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
}
